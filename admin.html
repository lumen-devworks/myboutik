<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYBOUTIK — Admin</title>
<style>
  :root{ --blue:#2563eb; --ink:#0f172a; --gray:#64748b; --border:#e2e8f0; --bg:#f8fafc; --amber-bg:#fffbeb; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);padding:24px}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:20px;margin-bottom:16px}
  h3{font-size:15px;margin-bottom:12px}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
  input{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;font-size:14px;margin-bottom:10px}
  button{border:none;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--border)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border)}
  .msg{font-size:13px;padding:8px 10px;border-radius:8px;background:#fef2f2;color:#b91c1c;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>MYBOUTIK — Panneau admin</h1>
  <div class="card" id="loginCard">
    <div id="loginMsg"></div>
    <input type="password" id="adminPassword" placeholder="Mot de passe admin (ADMIN_PASSWORD)">
    <button onclick="loadAll()">Se connecter</button>
  </div>
  <div id="dataCards" style="display:none">
    <div class="card">
      <h3>Demandes d'abonnement en attente</h3>
      <div id="subsBody"></div>
    </div>
    <div class="card">
      <h3>Retraits d'affiliation en attente</h3>
      <div id="payoutsBody"></div>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script>
const API_URL = window.MYBOUTIK_API_URL || 'http://localhost:8000';
function call(action, extra) {
  const password = sessionStorage.getItem('myboutik_admin_pw') || document.getElementById('adminPassword').value;
  return fetch(API_URL+'/admin?action='+action, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(Object.assign({password}, extra||{}))})
    .then(r => r.json());
}
function loadAll() {
  call('subscription_requests').then(data => {
    if (!data.success) { document.getElementById('loginMsg').innerHTML = '<div class="msg">'+data.message+'</div>'; return; }
    sessionStorage.setItem('myboutik_admin_pw', document.getElementById('adminPassword').value);
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('dataCards').style.display = 'block';
    renderSubs(data.data);
    call('payouts_pending').then(d2 => renderPayouts(d2.data || []));
  }).catch(() => { document.getElementById('loginMsg').innerHTML = '<div class="msg">Impossible de contacter le serveur.</div>'; });
}
function renderSubs(rows) {
  document.getElementById('subsBody').innerHTML = rows.length ? `<table><thead><tr><th>Email</th><th>Plan</th><th>Date</th><th></th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${r.email}</td><td>${r.plan}</td><td>${new Date(r.created_at).toLocaleString('fr-FR')}</td>
      <td><button onclick="review('${r.id}','subscription_approve')">Approuver</button>
          <button class="ghost" onclick="review('${r.id}','subscription_reject')">Rejeter</button></td></tr>`).join('')}
    </tbody></table>` : '<p style="color:var(--gray)">Aucune demande en attente.</p>';
}
function renderPayouts(rows) {
  document.getElementById('payoutsBody').innerHTML = rows.length ? `<table><thead><tr><th>Email</th><th>Montant</th><th>Méthode</th><th>Numéro</th><th></th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${r.email}</td><td>${Math.round(r.amount).toLocaleString('fr-FR')} FCFA</td><td>${r.method||'—'}</td><td>${r.phone||'—'}</td>
      <td><button onclick="markPayoutPaid('${r.id}')">Marquer payé</button></td></tr>`).join('')}
    </tbody></table>` : '<p style="color:var(--gray)">Aucun retrait en attente.</p>';
}
function review(id, action) {
  call(action, {id}).then(() => loadAll());
}
function markPayoutPaid(id) {
  call('payout_mark_paid', {id}).then(() => loadAll());
}
if (sessionStorage.getItem('myboutik_admin_pw')) {
  document.getElementById('adminPassword').value = sessionStorage.getItem('myboutik_admin_pw');
  loadAll();
}
</script>
</body>
</html>
