<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYBOUTIK — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Titan+One&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2f5be0; --blue-dark:#1e3fae; --blue-light:#eef2ff;
    --ink:#0e1526; --gray:#66708a; --border:#e4e8f2; --bg:#f4f6fb; --amber-bg:#fffbeb;
    --green:#0f9d63; --red:#dc3545;
    --shadow-sm:0 1px 2px rgba(14,21,38,.05);
    --shadow-md:0 10px 30px -12px rgba(14,21,38,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    color:var(--ink);
    background:radial-gradient(1100px 500px at 15% -10%, #eef2ff 0%, transparent 60%), var(--bg);
    padding:32px 24px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto}
  .topbar{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;margin-bottom:24px;
    background:#fff;
    border:2px solid transparent;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#3358e0 0%,#4b3fd1 45%,#7c3aed 100%);
    background-origin:border-box;background-clip:padding-box,border-box;
    border-radius:20px;padding:22px 26px;
    box-shadow:0 16px 36px -18px rgba(76,57,209,.5);
  }
  .topbar .mark{grid-column:1;justify-self:start;width:58px;height:58px;border-radius:16px;background:linear-gradient(145deg,var(--blue),var(--blue-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Titan One',cursive;font-weight:400;font-size:19px;letter-spacing:0;text-shadow:0 1.5px 0 rgba(0,0,0,.18);box-shadow:var(--shadow-md);flex-shrink:0}
  .topbar .titles{grid-column:2;text-align:center}
  .topbar h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--ink)}
  .topbar .sub{font-size:13px;color:var(--gray);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
  h3{font-size:15px;font-weight:700;margin-bottom:14px;letter-spacing:-.01em}
  .card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
  input,select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;margin-bottom:10px;font-family:inherit;color:var(--ink);transition:border-color .15s,box-shadow .15s;background:#fff}
  input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-light)}
  .password-wrap{position:relative}
  .password-wrap input{padding-right:40px}
  .pw-toggle{position:absolute;right:5px;top:9px;background:none;border:none;cursor:pointer;font-size:16px;padding:5px;line-height:1}
  button{border:none;border-radius:10px;padding:10px 17px;font-size:13.5px;font-weight:700;cursor:pointer;background:linear-gradient(155deg,var(--blue),var(--blue-dark));color:#fff;transition:transform .12s,box-shadow .12s;letter-spacing:.01em;font-family:inherit}
  button:hover{box-shadow:0 6px 16px -4px rgba(47,91,224,.5);transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--border);box-shadow:none}
  button.ghost:hover{border-color:var(--blue);color:var(--blue);box-shadow:none;background:var(--blue-light)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{position:sticky;top:0;background:#fafbfe;text-transform:uppercase;font-size:11px;letter-spacing:.04em;color:var(--gray);font-weight:700}
  th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--border)}
  tbody tr{transition:background .1s}
  tbody tr:hover{background:var(--blue-light)}
  tbody tr:last-child td{border-bottom:none}
  .msg{font-size:13px;padding:9px 12px;border-radius:9px;background:#fef2f2;color:#b91c1c;margin-bottom:10px;border:1px solid #fecaca}
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
  .stat{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow-sm);border-top:3px solid var(--accent,var(--blue));position:relative;overflow:hidden}
  .stat .lbl{font-size:11.5px;color:var(--gray);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  .stat .val{font-size:24px;font-weight:800;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.01em}
  .pill-ok{background:#e3f9ee;color:var(--green)}
  .pill-warn{background:#fef3c7;color:#92400e}
  .pill-bad{background:#fde8ea;color:var(--red)}
  .table-wrap{overflow-x:auto}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:13px;cursor:pointer}
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  #toastContainer{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:90vw}
  .toast{pointer-events:auto;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 6px 18px rgba(15,23,42,.15);max-width:440px;text-align:center;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast-success{background:#dcfce7;color:#166534;border:1px solid #86efac}
  .toast-error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
  .toast-info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
  .bq-list summary{cursor:pointer;color:var(--blue);font-weight:700;font-size:13px;list-style:none}
  .bq-list summary::-webkit-details-marker{display:none}
  .bq-list summary::after{content:' ▾';font-size:10px}
  .bq-list[open] summary::after{content:' ▴'}
  .bq-list .bq-menu{margin-top:6px;background:var(--blue-light);border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:12.5px;color:var(--ink);max-width:280px}
  .bq-list .bq-menu div{padding:2px 0}
  .chart-legend{display:flex;gap:18px;font-size:12px;color:var(--gray);margin-bottom:10px;font-weight:600}
  .chart-legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .chart-legend .diamond{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:middle;transform:rotate(45deg)}
  .copy-btn{background:none;border:none;padding:2px 4px;cursor:pointer;font-size:12px;color:var(--gray);box-shadow:none;font-weight:600}
  .copy-btn:hover{color:var(--blue);box-shadow:none;transform:none;background:none}
  .badge-late{background:#fde8ea;color:var(--red);font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:8px;white-space:nowrap}
  .filters-row select{width:auto;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="mark">MB</div>
    <div class="titles"><h1>MYBOUTIK</h1><div class="sub">Panneau admin — Gestion de la plateforme</div></div>
  </div>
  <div class="card" id="loginCard">
    <div id="loginMsg"></div>
    <div class="password-wrap"><input type="password" id="adminPassword" placeholder="Mot de passe admin (ADMIN_PASSWORD)">
      <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('adminPassword', this)">🙈</button></div>
    <button onclick="loadAll()">Se connecter</button>
  </div>
  <div id="dataCards" style="display:none">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="card">
      <h3>Demandes d'abonnement en attente</h3>
      <div id="subsBody"></div>
    </div>
    <div class="card">
      <h3>Retraits d'affiliation en attente</h3>
      <div id="payoutsBody"></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:12px">
        <h3 style="margin:0">Revenus par mois</h3>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <select id="revenueYear" onchange="renderRevenue()" style="width:auto;margin:0"></select>
          <div><span style="color:var(--gray);font-size:13px">Total de l'année : </span><strong id="revenueYearTotal" style="font-size:18px"></strong></div>
          <button class="ghost" onclick="exportRevenueExcel()">⬇️ Excel</button>
          <button class="ghost" onclick="exportRevenuePdf()">⬇️ PDF</button>
        </div>
      </div>
      <div class="chart-legend"><span><span class="dot" style="background:#2f5be0"></span>Revenu mensuel</span><span><span class="diamond" style="background:#f59e0b"></span>Revenu cumulé <span style="font-weight:400">(échelle propre à chaque courbe)</span></span></div>
      <div id="revenueChart" style="margin-bottom:16px"></div>
      <div class="table-wrap" id="revenueBody"></div>
    </div>
    <div class="card">
      <h3>Tous les clients</h3>
      <div class="filters-row" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
        <input id="clientSearch" placeholder="Rechercher par email…" style="max-width:220px;margin:0;flex:1 1 180px" oninput="renderClients()">
        <select id="clientFilterPlan" onchange="renderClients()">
          <option value="">Tous les plans</option>
          <option value="starter">Starter</option>
          <option value="pro">Pro</option>
          <option value="premium">Premium</option>
        </select>
        <select id="clientFilterStatus" onchange="renderClients()">
          <option value="">Tous les statuts</option>
          <option value="ok">Actif</option>
          <option value="warn">Expire bientôt</option>
          <option value="bad">Expiré</option>
        </select>
        <div style="display:flex;gap:8px;flex-shrink:0">
          <button class="ghost" onclick="exportClientsExcel()">⬇️ Exporter Excel</button>
          <button class="ghost" onclick="exportClientsPdf()">⬇️ Exporter PDF</button>
        </div>
      </div>
      <div class="table-wrap" id="clientsBody"></div>
    </div>
    <div class="card">
      <h3>Historique des paiements (300 derniers)</h3>
      <input id="historySearch" placeholder="Rechercher par email ou plan…" style="max-width:280px" oninput="renderHistoryFiltered()">
      <div class="table-wrap" id="historyBody"></div>
    </div>
  </div>
</div>
<div id="toastContainer"></div>
<script src="config.js"></script>
<script>
const API_URL = window.MYBOUTIK_API_URL || 'http://localhost:8000';
function call(action, extra) {
  const password = sessionStorage.getItem('myboutik_admin_pw') || document.getElementById('adminPassword').value;
  return fetch(API_URL+'/admin?action='+action, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(Object.assign({password}, extra||{}))})
    .then(r => r.json());
}
// L'icone reflete l'etat ACTUEL du champ : 🙈 = actuellement masque
// (cliquer pour reveler), 👁️ = actuellement visible (cliquer pour masquer).
function togglePasswordVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  const reveal = input.type === 'password';
  input.type = reveal ? 'text' : 'password';
  btn.textContent = reveal ? '👁️' : '🙈';
}
function showToast(message, type) {
  const container = document.getElementById('toastContainer');
  if (!container) { window.alert(message); return; }
  const el = document.createElement('div');
  el.className = 'toast toast-' + (type || 'info');
  el.textContent = message;
  container.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }, 4000);
}
let CLIENTS = [];
let REVENUE_BY_MONTH = []; // [{month:'2026-09', revenue: 12000}, ...]
const MONTH_NAMES = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
function setupRevenueYears() {
  const years = Array.from(new Set(REVENUE_BY_MONTH.map(r => r.month.slice(0,4)))).sort().reverse();
  const currentYear = String(new Date().getFullYear());
  if (!years.includes(currentYear)) years.unshift(currentYear);
  const sel = document.getElementById('revenueYear');
  sel.innerHTML = years.map(y => '<option value="'+y+'">'+y+'</option>').join('');
  renderRevenue();
}
const MONTH_ABBR = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];
let CURRENT_REVENUE_ROWS = [];
let CURRENT_REVENUE_YEAR = '';
function renderRevenue() {
  const year = document.getElementById('revenueYear').value;
  CURRENT_REVENUE_YEAR = year;
  const byMonth = {};
  REVENUE_BY_MONTH.filter(r => r.month.startsWith(year)).forEach(r => { byMonth[r.month.slice(5,7)] = r.revenue; });
  const total = Object.values(byMonth).reduce((s,v) => s+Number(v), 0);
  document.getElementById('revenueYearTotal').textContent = fmtMoney(total);
  const rows = MONTH_NAMES.map((name, i) => {
    const key = String(i+1).padStart(2,'0');
    return {name, revenue: byMonth[key] || 0};
  });
  CURRENT_REVENUE_ROWS = rows;
  const now = new Date();
  const lastElapsedMonth = (Number(year) === now.getFullYear()) ? (now.getMonth() + 1) : 12;
  renderRevenueChart(rows, lastElapsedMonth);
  document.getElementById('revenueBody').innerHTML = `<table><thead><tr><th>Mois</th><th>Revenu</th></tr></thead><tbody>
    ${rows.map(r => '<tr><td>'+r.name+'</td><td>'+(r.revenue ? fmtMoney(r.revenue) : '—')+'</td></tr>').join('')}
    </tbody></table>`;
}
// Petit graphique en courbe SVG fait main (pas de bibliotheque) - les 12
// mois de l'annee restent toujours affiches sur l'axe (Jan a Dec), mais la
// courbe (et sa zone degradee) ne se trace que jusqu'au dernier mois deja
// ecoule : les mois futurs n'ont tout simplement pas encore de point relie,
// plutot que de retomber artificiellement a zero. Une seconde courbe
// (pointillee, violette) superpose le revenu cumule, mise a l'echelle sur
// son propre maximum pour rester lisible a cote de la courbe mensuelle.
function renderRevenueChart(rows, lastElapsedMonth) {
  const w = 760, h = 200, padBottom = 26, padTop = 16, padSide = 16;
  const max = Math.max(1, ...rows.map(r => Number(r.revenue)));
  const innerW = w - padSide*2;
  const innerH = h - padTop - padBottom;
  const pts = rows.map((r, i) => {
    const x = padSide + (i / (rows.length - 1)) * innerW;
    const y = padTop + innerH - (Number(r.revenue) / max) * innerH;
    return {x, y, r, i};
  });
  const elapsed = pts.slice(0, lastElapsedMonth);
  const curveThrough = (points) => {
    let path = `M ${points[0].x} ${points[0].y}`;
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[i], p1 = points[i+1];
      const midX = (p0.x + p1.x) / 2;
      path += ` C ${midX} ${p0.y}, ${midX} ${p1.y}, ${p1.x} ${p1.y}`;
    }
    return path;
  };
  let path = '', areaPath = '';
  if (elapsed.length >= 2) {
    path = curveThrough(elapsed);
    areaPath = `${path} L ${elapsed[elapsed.length-1].x} ${h - padBottom} L ${elapsed[0].x} ${h - padBottom} Z`;
  }
  // Courbe cumulative : meme abscisses que les mois ecoules, ordonnee mise
  // a l'echelle sur son propre maximum (le dernier point, puisque croissante).
  let cumuPath = '';
  const cumuValues = [];
  let running = 0;
  elapsed.forEach(p => { running += Number(p.r.revenue); cumuValues.push(running); });
  const cumuMax = Math.max(1, ...cumuValues);
  if (elapsed.length >= 2) {
    const cumuPts = elapsed.map((p, i) => ({x: p.x, y: padTop + innerH - (cumuValues[i] / cumuMax) * innerH}));
    cumuPath = curveThrough(cumuPts);
  }
  const dots = pts.map(p => `<circle cx="${p.x}" cy="${p.y}" r="4" fill="${p.i < lastElapsedMonth ? (p.r.revenue > 0 ? '#2f5be0' : '#cbd5e1') : '#f1f5f9'}" stroke="#fff" stroke-width="1.5"><title>${MONTH_NAMES[p.i]} : ${p.i < lastElapsedMonth ? fmtMoney(p.r.revenue) : 'à venir'}</title></circle>`).join('');
  // Marqueurs en losange pour la courbe cumulee - une forme differente de
  // celle du revenu mensuel (des ronds) pour rester lisible meme quand les
  // deux courbes se superposent exactement (cas d'un seul mois avec du
  // revenu, ou tout le cumul se fait d'un coup).
  const cumuDots = elapsed.length >= 2 ? elapsed.map((p, i) => {
    const cy = padTop + innerH - (cumuValues[i] / cumuMax) * innerH;
    return `<rect x="${p.x-3.5}" y="${cy-3.5}" width="7" height="7" fill="#f59e0b" stroke="#fff" stroke-width="1.2" transform="rotate(45 ${p.x} ${cy})"><title>${MONTH_NAMES[p.i]} : cumul ${fmtMoney(cumuValues[i])}</title></rect>`;
  }).join('') : '';
  const labels = pts.map(p => `<text x="${p.x}" y="${h - 8}" text-anchor="middle" font-size="11" fill="${p.i < lastElapsedMonth ? '#64748b' : '#cbd5e1'}">${MONTH_ABBR[p.i]}</text>`).join('');
  const gridY = h - padBottom;
  document.getElementById('revenueChart').innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-height:220px">
    <defs><linearGradient id="revFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f5be0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2f5be0" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="${padSide}" y1="${gridY}" x2="${w - padSide}" y2="${gridY}" stroke="#e2e8f0" stroke-width="1"/>
    ${areaPath ? `<path d="${areaPath}" fill="url(#revFill)"/>` : ''}
    ${path ? `<path d="${path}" fill="none" stroke="#2f5be0" stroke-width="2.5"/>` : ''}
    ${cumuPath ? `<path d="${cumuPath}" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7 5" stroke-linecap="round"/>` : ''}
    ${dots}
    ${cumuDots}
    ${labels}
  </svg>`;
}
function loadAll() {
  call('subscription_requests').then(data => {
    if (!data.success) { document.getElementById('loginMsg').innerHTML = '<div class="msg">'+data.message+'</div>'; return; }
    sessionStorage.setItem('myboutik_admin_pw', document.getElementById('adminPassword').value);
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('dataCards').style.display = 'block';
    renderSubs(data.data);
    call('payouts_pending').then(d2 => renderPayouts(d2.data || []));
    call('clients_list').then(d3 => {
      if (!d3.success) { document.getElementById('clientsBody').innerHTML = '<p style="color:#b91c1c">'+d3.message+'</p>'; return; }
      CLIENTS = d3.data || []; renderStats(CLIENTS); renderClients();
    });
    call('subscription_history').then(d4 => {
      if (!d4.success) { document.getElementById('historyBody').innerHTML = '<p style="color:#b91c1c">'+d4.message+'</p>'; return; }
      renderHistory(d4.data || []);
    });
    call('revenue_by_month').then(d5 => {
      if (!d5.success) { document.getElementById('revenueBody').innerHTML = '<p style="color:#b91c1c">'+d5.message+'</p>'; return; }
      REVENUE_BY_MONTH = d5.data || []; setupRevenueYears();
    });
  }).catch(() => { document.getElementById('loginMsg').innerHTML = '<div class="msg">Impossible de contacter le serveur.</div>'; });
}
function fmtMoney(n) { return Math.round(n||0).toLocaleString('fr-FR') + ' FCFA'; }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('fr-FR') : '—'; }
// 'ok'/'warn'/'bad' - reutilise par le pill d'affichage ET par le filtre de statut.
function clientStatusKey(c) {
  if (!c.plan_valid_until) return 'ok';
  const daysLeft = Math.ceil((new Date(c.plan_valid_until) - new Date()) / 86400000);
  if (daysLeft < 0) return 'bad';
  if (daysLeft <= 5) return 'warn';
  return 'ok';
}
function clientStatusPill(c) {
  const key = clientStatusKey(c);
  if (key === 'bad') return '<span class="pill pill-bad">Expiré</span>';
  if (key === 'warn') return '<span class="pill pill-warn">Expire bientôt</span>';
  return '<span class="pill pill-ok">Actif</span>';
}
// Le nombre seul ne dit pas quelle(s) boutique(s) - avec plus de quelques
// boutiques ca devient illisible en ligne, d'ou un menu deroulant (<details>)
// qui affiche les noms au clic plutot que tout en dur dans la cellule.
// Si le compte n'en possede aucune, on affiche plutot celles ou il est
// simple membre, pour ne pas laisser un "0" sans explication.
function boutiqueCell(c) {
  const owned = c.boutique_names || [];
  if (owned.length) {
    return `<details class="bq-list"><summary>${c.boutique_count} boutique${c.boutique_count>1?'s':''}</summary>
      <div class="bq-menu">${owned.map(n => '<div>🏬 '+escapeAttr(n)+'</div>').join('')}</div></details>`;
  }
  const member = c.member_boutique_names || [];
  if (member.length) {
    return `0 <details class="bq-list" style="display:inline-block"><summary style="color:var(--gray)">(membre de ${member.length})</summary>
      <div class="bq-menu">${member.map(n => '<div>🏬 '+escapeAttr(n)+'</div>').join('')}</div></details>`;
  }
  return '0';
}
function escapeAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function renderStats(rows) {
  const total = rows.length;
  const expired = rows.filter(c => c.plan_valid_until && (new Date(c.plan_valid_until) - new Date()) < 0).length;
  const active = total - expired;
  const revenue = rows.reduce((s,c) => s + Number(c.total_paid||0), 0);
  const byPlan = {};
  rows.forEach(c => { byPlan[c.plan] = (byPlan[c.plan]||0) + 1; });
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat" style="--accent:#2f5be0"><div class="lbl">Clients</div><div class="val">${total}</div></div>
    <div class="stat" style="--accent:#0f9d63"><div class="lbl">Actifs</div><div class="val">${active}</div></div>
    <div class="stat" style="--accent:#dc3545"><div class="lbl">Expirés</div><div class="val">${expired}</div></div>
    <div class="stat" style="--accent:#7c3aed"><div class="lbl">Revenu total</div><div class="val">${fmtMoney(revenue)}</div></div>
  `;
}
// Colonnes triables : cle -> [libelle, fonction d'extraction de la valeur a comparer]
const CLIENT_COLUMNS = {
  email:      ['Email', c => c.email.toLowerCase()],
  full_name:  ['Nom', c => (c.full_name||'').toLowerCase()],
  plan:       ['Plan', c => c.plan],
  status:     ['Statut', c => c.plan_valid_until ? new Date(c.plan_valid_until).getTime() : Infinity],
  plan_valid_until: ['Expire le', c => c.plan_valid_until ? new Date(c.plan_valid_until).getTime() : -1],
  boutique_count: ['Boutiques (propriétaire)', c => Number(c.boutique_count)],
  payments_count: ['Paiements', c => Number(c.payments_count)],
  total_paid: ['Total payé', c => Number(c.total_paid)],
  created_at: ['Inscrit le', c => new Date(c.created_at).getTime()],
};
let clientSort = {key: 'created_at', dir: -1};
function sortClients(key) {
  clientSort = (clientSort.key === key) ? {key, dir: -clientSort.dir} : {key, dir: 1};
  renderClients();
}
function renderClients() {
  let rows = filteredClients();
  const getVal = CLIENT_COLUMNS[clientSort.key][1];
  rows = rows.slice().sort((a,b) => {
    const va = getVal(a), vb = getVal(b);
    return (va > vb ? 1 : va < vb ? -1 : 0) * clientSort.dir;
  });
  const th = key => {
    const arrow = clientSort.key === key ? (clientSort.dir === 1 ? ' ▲' : ' ▼') : '';
    return `<th style="cursor:pointer;user-select:none" onclick="sortClients('${key}')">${CLIENT_COLUMNS[key][0]}${arrow}</th>`;
  };
  document.getElementById('clientsBody').innerHTML = rows.length ? `<table><thead><tr>
      ${Object.keys(CLIENT_COLUMNS).map(th).join('')}
    </tr></thead><tbody>
    ${rows.map(c => `<tr>
      <td>${c.email} <button class="copy-btn" title="Copier l'email" onclick="copyClientEmail('${c.email}')">📋</button></td>
      <td>${c.full_name||'—'}</td><td>${c.plan}</td><td>${clientStatusPill(c)}</td>
      <td>${fmtDate(c.plan_valid_until)}</td><td>${boutiqueCell(c)}</td><td>${c.payments_count}</td>
      <td>${fmtMoney(c.total_paid)}</td><td>${fmtDate(c.created_at)}</td>
    </tr>`).join('')}
    </tbody></table>` : '<p style="color:var(--gray)">Aucun client ne correspond à cette recherche.</p>';
}
function copyClientEmail(email) {
  navigator.clipboard.writeText(email).then(() => showToast('Email copié : '+email, 'success')).catch(() => showToast('Impossible de copier', 'error'));
}
function filteredClients() {
  const q = (document.getElementById('clientSearch').value || '').toLowerCase();
  const plan = document.getElementById('clientFilterPlan').value;
  const status = document.getElementById('clientFilterStatus').value;
  return CLIENTS.filter(c =>
    (!q || c.email.toLowerCase().includes(q) || (c.full_name||'').toLowerCase().includes(q)) &&
    (!plan || c.plan === plan) &&
    (!status || clientStatusKey(c) === status)
  );
}
function clientExportRows() {
  const headers = ['Email','Nom','Plan','Expire le','Nb. boutiques','Noms des boutiques','Paiements','Total payé (FCFA)','Inscrit le'];
  const rows = filteredClients().map(c => [c.email, c.full_name||'—', c.plan, fmtDate(c.plan_valid_until), c.boutique_count, (c.boutique_names||[]).join(', ') || (c.member_boutique_names||[]).map(n=>n+' (membre)').join(', ') || '—', c.payments_count, fmtMoney(c.total_paid), fmtDate(c.created_at)]);
  return {headers, rows};
}
// Fichier .xls (tableau HTML) plutot qu'un CSV brut : s'ouvre directement
// dans Excel/LibreOffice avec la mise en forme deja appliquee (en-tetes en
// gras, bordures, titre colore) - meme technique que les exports Finance du
// tableau de bord marchand. Genere entierement cote navigateur, admin.html
// n'ayant pas de lien telechargeable classique (authentification par mot de
// passe dans le corps d'une requete POST). Fonctions generiques reutilisees
// par les exports Clients ET Revenus.
function exportExcel(title, filename, headers, rows) {
  let html = '<table border="1" cellspacing="0" cellpadding="6" style="border-collapse:collapse;font-family:Arial,sans-serif;font-size:12px">';
  html += '<tr><td colspan="'+headers.length+'" style="background:#1d4ed8;color:#ffffff;font-size:15px;font-weight:bold;padding:10px">'+title+'</td></tr>';
  html += '<tr>'+headers.map(h => '<th style="background:#eff6ff;font-weight:bold;text-align:left;padding:6px;border:1px solid #cbd5e1">'+h+'</th>').join('')+'</tr>';
  rows.forEach(r => { html += '<tr>'+r.map(v => '<td style="padding:6px;border:1px solid #cbd5e1">'+v+'</td>').join('')+'</tr>'; });
  html += '</table>';
  const blob = new Blob(['﻿<html><head><meta charset="UTF-8"></head><body>'+html+'</body></html>'], {type:'application/vnd.ms-excel;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
// Ouvre un apercu deja mis en page dans un nouvel onglet et lance
// l'impression - le navigateur propose "Enregistrer en PDF" comme
// destination, ce qui donne un vrai PDF sans bibliotheque serveur.
function exportPdf(title, headers, rows) {
  const win = window.open('', '_blank', 'width=900,height=700');
  win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${title}</title>
    <style>
      body{font-family:Arial,sans-serif;color:#111;padding:28px;max-width:900px;margin:0 auto}
      h1{font-size:18px;margin:0 0 14px}
      table{width:100%;border-collapse:collapse;font-size:12px}
      th,td{padding:6px 8px;border-bottom:1px solid #ddd;text-align:left;white-space:nowrap}
      th{background:#eff6ff}
    </style></head><body>
    <h1>${title} — ${new Date().toLocaleDateString('fr-FR')}</h1>
    <table><thead><tr>${headers.map(h=>'<th>'+h+'</th>').join('')}</tr></thead><tbody>
      ${rows.map(r => '<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')}
    </tbody></table>
    <script>window.onload = () => window.print();<\/script>
    </body></html>`);
  win.document.close();
}
function exportClientsExcel() {
  const {headers, rows} = clientExportRows();
  exportExcel('Clients MYBOUTIK', 'clients-myboutik.xls', headers, rows);
}
function exportClientsPdf() {
  const {headers, rows} = clientExportRows();
  exportPdf('Clients MYBOUTIK', headers, rows);
}
function exportRevenueExcel() {
  const {headers, rows} = revenueExportRows();
  exportExcel('Revenus '+CURRENT_REVENUE_YEAR+' — MYBOUTIK', 'revenus-'+CURRENT_REVENUE_YEAR+'-myboutik.xls', headers, rows);
}
function exportRevenuePdf() {
  const {headers, rows} = revenueExportRows();
  exportPdf('Revenus '+CURRENT_REVENUE_YEAR+' — MYBOUTIK', headers, rows);
}
function revenueExportRows() {
  const headers = ['Mois','Revenu (FCFA)'];
  const total = CURRENT_REVENUE_ROWS.reduce((s,r) => s+Number(r.revenue), 0);
  const rows = CURRENT_REVENUE_ROWS.map(r => [r.name, r.revenue ? fmtMoney(r.revenue) : '—']);
  rows.push(['Total '+CURRENT_REVENUE_YEAR, fmtMoney(total)]);
  return {headers, rows};
}
let HISTORY_ROWS = [];
function renderHistory(rows) {
  HISTORY_ROWS = rows;
  renderHistoryFiltered();
}
function renderHistoryFiltered() {
  const q = (document.getElementById('historySearch').value || '').toLowerCase();
  const rows = HISTORY_ROWS.filter(r => !q || r.email.toLowerCase().includes(q) || r.plan.toLowerCase().includes(q));
  const statusPill = s => s==='approved' ? '<span class="pill pill-ok">Approuvé</span>' : s==='rejected' ? '<span class="pill pill-bad">Rejeté</span>' : '<span class="pill pill-warn">En attente</span>';
  document.getElementById('historyBody').innerHTML = rows.length ? `<table><thead><tr><th>Email</th><th>Plan</th><th>Statut</th><th>Demandé le</th><th>Traité le</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${r.email}</td><td>${r.plan}</td><td>${statusPill(r.status)}</td><td>${new Date(r.created_at).toLocaleString('fr-FR')}</td><td>${r.reviewed_at?new Date(r.reviewed_at).toLocaleString('fr-FR'):'—'}</td></tr>`).join('')}
    </tbody></table>` : '<p style="color:var(--gray)">Aucun historique ne correspond à cette recherche.</p>';
}
function renderSubs(rows) {
  const hoursSince = r => (Date.now() - new Date(r.created_at).getTime()) / 3600000;
  document.getElementById('subsBody').innerHTML = rows.length ? `<table><thead><tr><th>Email</th><th>Plan</th><th>Date</th><th></th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${r.email}</td><td>${r.plan}</td><td>${new Date(r.created_at).toLocaleString('fr-FR')}${hoursSince(r) > 24 ? '<span class="badge-late">⚠️ En attente depuis '+Math.floor(hoursSince(r)/24)+' j</span>' : ''}</td>
      <td><button onclick="review('${r.id}','subscription_approve','${r.email}','${r.plan}',true)">Approuver</button>
          <button class="ghost" onclick="review('${r.id}','subscription_reject','${r.email}','${r.plan}',false)">Rejeter</button></td></tr>`).join('')}
    </tbody></table>` : '<p style="color:var(--gray)">Aucune demande en attente.</p>';
}
function renderPayouts(rows) {
  document.getElementById('payoutsBody').innerHTML = rows.length ? `<table><thead><tr><th>Email</th><th>Montant</th><th>Méthode</th><th>Numéro</th><th></th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${r.email}</td><td>${Math.round(r.amount).toLocaleString('fr-FR')} FCFA</td><td>${r.method||'—'}</td><td>${r.phone||'—'}</td>
      <td><button onclick="markPayoutPaid('${r.id}','${r.email}',${Math.round(r.amount)})">Marquer payé</button></td></tr>`).join('')}
    </tbody></table>` : '<p style="color:var(--gray)">Aucun retrait en attente.</p>';
}
function review(id, action, email, plan, isApprove) {
  const question = isApprove
    ? 'Approuver le plan '+plan+' pour '+email+' ?\n\nSon abonnement sera activé/prolongé de 30 jours.'
    : 'Rejeter la demande de plan '+plan+' pour '+email+' ?';
  if (!confirm(question)) return;
  call(action, {id}).then(data => {
    showToast(data.message || (data.success ? 'Fait.' : 'Erreur.'), data.success ? 'success' : 'error');
    loadAll();
  });
}
function markPayoutPaid(id, email, amount) {
  if (!confirm('Confirmer que le retrait de '+amount.toLocaleString('fr-FR')+' FCFA pour '+email+' a bien été payé ?\n\nCette action est irréversible.')) return;
  call('payout_mark_paid', {id}).then(data => {
    showToast(data.message || (data.success ? 'Paiement marqué payé.' : 'Erreur.'), data.success ? 'success' : 'error');
    loadAll();
  });
}
if (sessionStorage.getItem('myboutik_admin_pw')) {
  document.getElementById('adminPassword').value = sessionStorage.getItem('myboutik_admin_pw');
  loadAll();
}
</script>
