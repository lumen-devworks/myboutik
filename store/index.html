<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique</title>
<style>
  :root{ --blue:#ea580c; --blue-dark:#c2410c; --ink:#0f172a; --gray:#64748b; --border:#e2e8f0; --bg:#f8fafc; --green:#16a34a; --green-bg:#ecfdf5; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:#fff}
  a{color:inherit;text-decoration:none}
  button,input,textarea{font-family:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  header{border-bottom:1px solid var(--border);padding:16px 0;position:sticky;top:0;background:#fff;z-index:10}
  header .bar{display:flex;align-items:center;justify-content:space-between}
  .shop-name{font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50vw}
  #cartBtn{position:relative;border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
  #cartCount{position:absolute;top:-8px;right:-8px;background:var(--blue);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px}
  .lang-switch{display:flex;gap:3px;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:3px}
  .lang-switch button{background:none;color:var(--gray);border:none;padding:6px 10px;font-size:11px;font-weight:700;border-radius:999px;cursor:pointer}
  .lang-switch button.active{background:var(--blue);color:#fff}

  .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;padding:28px 0}
  .cat-pill{flex-shrink:0;padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:13px;cursor:pointer;white-space:nowrap}
  .cat-pill.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .product-card{border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;background:#fff;display:flex;flex-direction:column}
  .product-card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--bg)}
  .product-card .ph{width:100%;aspect-ratio:1/1;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--gray)}
  .product-card .body{padding:12px}
  .product-card .name{font-weight:600;font-size:14px;margin-bottom:4px}
  .product-card .price{font-weight:800;color:var(--blue)}

  .empty{text-align:center;color:var(--gray);padding:80px 20px}
  .empty .big{font-size:40px;margin-bottom:12px}

  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .overlay.open{display:flex}
  @media (min-width:640px){.overlay{align-items:center}}
  .sheet{background:#fff;border-radius:18px 18px 0 0;max-width:520px;width:100%;max-height:92vh;overflow-y:auto;padding:24px;position:relative}
  @media (min-width:640px){.sheet{border-radius:18px}}
  .sheet .close{position:absolute;top:14px;right:16px;border:none;background:none;font-size:20px;cursor:pointer;color:var(--gray)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field input,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px}
  .btn{border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;width:100%}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--border)}
  .qty-row{display:flex;align-items:center;gap:12px;margin:14px 0}
  .qty-row button{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:16px;cursor:pointer}
  .cart-line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
  .cart-line button{border:none;background:none;color:var(--gray);cursor:pointer;font-size:16px}
  .cart-total{display:flex;justify-content:space-between;font-weight:800;font-size:16px;padding:14px 0}
  .msg{font-size:13px;border-radius:10px;padding:9px 11px;margin-bottom:12px}
  .msg.error{background:#fef2f2;color:#b91c1c}
  .msg.success{background:var(--green-bg);color:#15803d}
  .confirm-box{text-align:center;padding:20px 0}
  .confirm-box .ic{width:54px;height:54px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px}
  footer{border-top:1px solid var(--border);padding:28px 0;margin-top:40px}
  footer .cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  @media (max-width:520px){footer .cols{grid-template-columns:1fr}}
  footer h4{font-size:14px;margin-bottom:10px}
  footer input,footer textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;font-size:13px;margin-bottom:8px}
  footer .btn{width:auto;padding:9px 16px}
</style>
</head>
<body>
<div id="root"><div class="empty">Chargement de la boutique…</div></div>

<div class="overlay" id="productOverlay"><div class="sheet" id="productSheet"></div></div>
<div class="overlay" id="cartOverlay"><div class="sheet" id="cartSheet"></div></div>
<div class="overlay" id="trackOverlay"><div class="sheet" id="trackSheet"></div></div>

<script src="../config.js"></script>
<script>
const API_URL = window.MYBOUTIK_API_URL || 'http://localhost:8000';
// Le slug de la boutique se lit soit dans le chemin /store/{slug}, soit dans
// ?b={slug} (fonctionne partout sans configuration serveur particuliere -
// voir README.md pour activer les URLs "jolies" /store/{slug}).
function getSlug() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('b')) return params.get('b');
  const parts = window.location.pathname.split('/').filter(Boolean);
  const i = parts.indexOf('store');
  if (i >= 0 && parts[i+1] && parts[i+1] !== 'index.html') return parts[i+1];
  return '';
}
const SLUG = getSlug();
function sessionId() {
  let id = sessionStorage.getItem('myboutik_session');
  if (!id) { id = 'sess_'+Math.random().toString(36).slice(2)+Date.now().toString(36); sessionStorage.setItem('myboutik_session', id); }
  return id;
}
function api(path, opts) {
  return fetch(API_URL+path, Object.assign({headers:{'Content-Type':'application/json','X-Lang':LANG}}, opts||{}))
    .then(r => r.json().then(data => ({status:r.status, data})))
    .catch(() => ({status:0, data:{success:false, message:t('server_unreachable')}}));
}
function post(path, body) { return api(path, {method:'POST', body:JSON.stringify(body||{})}); }
function fmtMoney(n, currency) { return Math.round(n||0).toLocaleString(LANG === 'en' ? 'en-US' : 'fr-FR') + ' ' + (currency||'FCFA'); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  },
};
function t(key) { return (I18N[LANG] && I18N[LANG][key]) ?? I18N.fr[key] ?? key; }
function tf(key, vars) {
  let s = t(key);
  Object.keys(vars || {}).forEach(k => { s = s.split('{'+k+'}').join(vars[k]); });
  return s;
}
function setLang(lang) {
  LANG = lang === 'en' ? 'en' : 'fr';
  localStorage.setItem('myboutik_shop_lang', LANG);
  if (BOUTIQUE) renderShop();
  const step = window.__cartStep;
  if (document.getElementById('cartOverlay').classList.contains('open')) renderCartSheet(step, checkoutFieldValues());
  if (document.getElementById('productOverlay').classList.contains('open') && window.__currentProductId) openProduct(window.__currentProductId);
  if (document.getElementById('trackOverlay').classList.contains('open')) openTrackOrder();
}

let BOUTIQUE = null, PRODUCTS = [], ACTIVE_PROMOS = [], CATEGORIES = [], CART = JSON.parse(sessionStorage.getItem('myboutik_cart')||'[]');
let CATALOG_FILTER = { category: '', search: '' };

function saveCart() { sessionStorage.setItem('myboutik_cart', JSON.stringify(CART)); renderCartCount(); }
function renderCartCount() {
  // Nombre d'articles differents dans le panier (pas la somme des
  // quantites) - correspond a ce que le client voit en ouvrant le panier :
  // 2 produits ajoutes, meme a 2 exemplaires chacun, affiche "2".
  const el = document.getElementById('cartCount');
  if (el) el.textContent = CART.length;
}

if (!SLUG) {
  document.getElementById('root').innerHTML = '<div class="empty"><div class="big">🏬</div>'+t('shop_not_found')+'<br><span style="font-size:13px">'+t('add_slug_hint')+'</span></div>';
} else {
  Promise.all([api('/shop?action=boutique&slug='+encodeURIComponent(SLUG)), api('/shop?action=products&slug='+encodeURIComponent(SLUG)), api('/shop?action=active_promos&slug='+encodeURIComponent(SLUG)), api('/shop?action=categories&slug='+encodeURIComponent(SLUG))]).then(([bt, prods, promos, cats]) => {
    if (!bt.data.success) { document.getElementById('root').innerHTML = '<div class="empty"><div class="big">🏬</div>'+t('shop_not_found_closed')+'</div>'; return; }
    BOUTIQUE = bt.data.data; PRODUCTS = prods.data.data || []; ACTIVE_PROMOS = (promos.data.success && promos.data.data) || [];
    CATEGORIES = (cats.data.success && cats.data.data) || [];
    document.title = BOUTIQUE.name;
    renderShop();
    post('/shop?action=track_visit', {slug:SLUG, session_id:sessionId(), path:window.location.pathname, referrer:document.referrer});
    // Lien direct vers une fiche produit (ex: partage sur WhatsApp) :
    // store/index.html?b=boutique&p=slug-du-produit ouvre directement sa fiche.
    const productSlug = new URLSearchParams(window.location.search).get('p');
    if (productSlug) {
      const match = PRODUCTS.find(x => x.slug === productSlug);
      if (match) openProduct(match.id);
    }
  });
}

function renderShop() {
  document.getElementById('root').innerHTML = `
    <header><div class="wrap bar">
      <div style="display:flex;align-items:center;gap:10px">
        ${BOUTIQUE.logo_url ? '<img src="'+escapeHtml(BOUTIQUE.logo_url)+'" style="width:36px;height:36px;border-radius:8px;object-fit:cover">' : ''}
        <div class="shop-name">${escapeHtml(BOUTIQUE.name)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="lang-switch"><button type="button" onclick="setLang('fr')" class="${LANG==='fr'?'active':''}">FR</button><button type="button" onclick="setLang('en')" class="${LANG==='en'?'active':''}">EN</button></div>
        <button class="btn btn-ghost btn-sm" onclick="openTrackOrder()">${t('track_order_btn')}</button>
        <button id="cartBtn" onclick="openCart()">${t('cart_btn')}<span id="cartCount">0</span></button>
      </div>
    </div></header>
    ${ACTIVE_PROMOS.length ? `<div class="wrap" style="padding-top:12px">
      <div style="background:#fff1e6;border:1px solid #fdba8c;border-radius:10px;padding:10px 14px;font-size:14px;color:#9a3412">
        🎉 ${ACTIVE_PROMOS.map(p => 'Code <strong>'+escapeHtml(p.code)+'</strong> : -'+(p.type==='percent' ? Number(p.value)+'%' : fmtMoney(p.value, BOUTIQUE.currency))).join(' &nbsp;|&nbsp; ')}${t('promo_banner_suffix')}
      </div>
    </div>` : ''}
    <div class="wrap">
      ${BOUTIQUE.description ? '<p style="color:var(--gray);margin:16px 0 0">'+escapeHtml(BOUTIQUE.description)+'</p>' : ''}
      ${PRODUCTS.length ? `
      <div style="margin:16px 0 8px">
        <input id="catalogSearch" placeholder="${t('search_placeholder')}" oninput="onCatalogSearchInput(this.value)" style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px">
      </div>
      ${CATEGORIES.length ? `<div id="categoryPills" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:10px"></div>` : ''}
      ` : ''}
      <div id="productGrid"></div>
    </div>
    <footer><div class="wrap cols">
      <div>
        <h4>${t('newsletter_title')}</h4>
        <div id="nlMsg"></div>
        <input id="nlEmail" type="email" placeholder="${t('email_placeholder')}">
        <button class="btn btn-primary" onclick="subscribeNewsletter()">${t('newsletter_btn')}</button>
      </div>
      <div>
        <h4>${t('contact_title')}</h4>
        <div id="ctMsg"></div>
        <input id="ctName" placeholder="${t('contact_name_placeholder')}">
        <input id="ctEmail" type="email" placeholder="${t('email_placeholder')}">
        <textarea id="ctMessage" rows="2" placeholder="${t('contact_message_placeholder')}"></textarea>
        <button class="btn btn-primary" onclick="sendContactMessage()">${t('contact_send_btn')}</button>
      </div>
    </div></footer>
  `;
  renderCartCount();
  renderCategoryPills();
  renderProductGrid();
}
function renderCategoryPills() {
  const el = document.getElementById('categoryPills');
  if (!el) return;
  el.innerHTML = `<button class="cat-pill ${!CATALOG_FILTER.category?'active':''}" onclick="selectCategory('')">${t('all_categories')}</button>
    ${CATEGORIES.map(c=>`<button class="cat-pill ${CATALOG_FILTER.category===c.id?'active':''}" onclick="selectCategory('${c.id}')">${escapeHtml(c.name)}</button>`).join('')}`;
}
// Ne touche jamais au reste de la page (recherche en cours, etc.) - seuls
// les pastilles de categorie et la grille sont reconstruites.
function selectCategory(categoryId) { CATALOG_FILTER.category = categoryId; renderCategoryPills(); renderProductGrid(); }
let catalogSearchTimer = null;
function onCatalogSearchInput(value) {
  clearTimeout(catalogSearchTimer);
  catalogSearchTimer = setTimeout(() => { CATALOG_FILTER.search = value.trim().toLowerCase(); renderProductGrid(); }, 200);
}
function renderProductGrid() {
  const grid = document.getElementById('productGrid');
  if (!grid) return;
  const filtered = PRODUCTS.filter(p => {
    if (CATALOG_FILTER.category && p.category_id !== CATALOG_FILTER.category) return false;
    if (CATALOG_FILTER.search && !p.name.toLowerCase().includes(CATALOG_FILTER.search)) return false;
    return true;
  });
  grid.innerHTML = PRODUCTS.length ? (filtered.length ? '<div class="products-grid">'+filtered.map(p => `
      <div class="product-card" onclick="openProduct('${p.id}')">
        ${p.image_url ? '<img src="'+escapeHtml(p.image_url)+'" alt="">' : '<div class="ph">🛍️</div>'}
        <div class="body"><div class="name">${escapeHtml(p.name)}</div>
          <div class="price">${fmtMoney(p.price, BOUTIQUE.currency)}${p.compare_at_price && Number(p.compare_at_price) > Number(p.price) ? ' <span style="color:var(--gray);font-weight:400;text-decoration:line-through;font-size:13px">'+fmtMoney(p.compare_at_price, BOUTIQUE.currency)+'</span>' : ''}</div>
        </div>
      </div>`).join('')+'</div>'
    : '<div class="empty"><div class="big">🔍</div>'+t('no_products_match')+'</div>')
    : '<div class="empty"><div class="big">🛍️</div>'+t('no_products_yet')+'</div>';
}

function openProduct(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  window.__currentProductId = id;
  const images = (p.images && p.images.length) ? p.images.map(img => img.data) : (p.image_url ? [p.image_url] : []);
  let optionGroups = [];
  try { optionGroups = p.options_json ? JSON.parse(p.options_json) : []; } catch(e) { optionGroups = []; }
  const hasVariants = p.variants && p.variants.length > 0;
  const useOptionSelectors = Array.isArray(optionGroups) && optionGroups.length > 0 && hasVariants;

  let variantHtml = '';
  if (useOptionSelectors) {
    // Un selecteur separe par option (Taille, Couleur...) plutot qu'une
    // seule liste avec les noms combines - l'acheteur choisit chaque
    // caracteristique independamment, comme sur un site marchand classique.
    variantHtml = optionGroups.map((g, gi) => `
      <div class="field"><label>${escapeHtml(g.name)}</label>
        <select id="pdOpt${gi}" onchange="resolveVariantSelection('${p.id}')">
          ${(g.values||[]).map(v => '<option value="'+escapeHtml(v)+'">'+escapeHtml(v)+'</option>').join('')}
        </select>
      </div>`).join('');
  } else if (hasVariants) {
    variantHtml = '<div class="field"><label>'+t('option_choice_label')+'</label><select id="pdVariant" onchange="updateVariantPrice(\''+p.id+'\')"><option value="">'+t('variant_standard')+'</option>'+
      p.variants.map(v=>'<option value="'+v.id+'" data-price="'+(v.price??p.price)+'">'+escapeHtml(v.name)+'</option>').join('')+'</select></div>';
  }

  document.getElementById('productSheet').innerHTML = `
    <button class="close" onclick="closeOverlay('productOverlay')">✕</button>
    ${images.length ? '<img id="pdHeroImage" src="'+escapeHtml(images[0])+'" style="width:100%;border-radius:12px;margin-bottom:8px;aspect-ratio:1/1;object-fit:cover">' : ''}
    ${images.length > 1 ? '<div style="display:flex;gap:6px;margin-bottom:14px;overflow-x:auto">'+images.map((src,i)=>'<img src="'+escapeHtml(src)+'" onclick="document.getElementById(\'pdHeroImage\').src=this.src" style="width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid '+(i===0?'var(--blue)':'var(--border)')+'">').join('')+'</div>' : ''}
    <h2>${escapeHtml(p.name)}</h2>
    <p style="color:var(--gray);font-size:14px;margin:8px 0">${escapeHtml(p.description||'')}</p>
    <div id="pdPrice">${renderPriceHtml(p.price, p.compare_at_price)}</div>
    ${variantHtml}
    <div class="qty-row"><button onclick="stepQty(-1)">-</button><span id="pdQty">1</span><button onclick="stepQty(1)">+</button></div>
    <button class="btn btn-primary" id="pdAddBtn" onclick="addToCart('${p.id}')">${t('add_to_cart_btn')}</button>
    <button class="btn btn-ghost" style="margin-top:8px" onclick="shareProductOnWhatsApp('${p.id}')">${t('share_whatsapp_btn')}</button>
    <div id="pdRelated"></div>
    <div id="pdReviewsSection"></div>
  `;
  document.getElementById('productOverlay').classList.add('open');
  window.__pdQty = 1;
  window.__pdResolvedVariant = null;
  if (useOptionSelectors) resolveVariantSelection(p.id);
  loadProductExtras(p.id);
}
// Lien direct vers cette fiche produit (le meme format que le deep-link
// ?p=slug deja gere au chargement de la page) glisse dans un message
// WhatsApp pre-rempli - tres courant comme canal de vente sur ce marche.
function shareProductOnWhatsApp(productId) {
  const p = PRODUCTS.find(x => x.id === productId);
  if (!p) return;
  const link = window.location.origin + window.location.pathname + '?b=' + encodeURIComponent(SLUG) + '&p=' + encodeURIComponent(p.slug || '');
  const text = p.name + ' — ' + fmtMoney(p.price, BOUTIQUE.currency) + '\n' + link;
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}
// Fiche produit chargee depuis le cache PRODUCTS (liste) qui ne porte pas les
// produits associes ni les avis - un second appel cible recupere ces
// donnees sans alourdir le chargement initial du catalogue entier.
function loadProductExtras(productId) {
  api('/shop?action=product&slug='+SLUG+'&id='+productId).then(({data}) => {
    if (!data.success) return;
    renderRelatedProducts(data.data.related||[]);
  });
  loadReviews(productId);
}
function openProductBySlug(slug) {
  const p = PRODUCTS.find(x => x.slug === slug);
  if (p) openProduct(p.id);
}
function renderRelatedProducts(related) {
  const el = document.getElementById('pdRelated');
  if (!el) return;
  if (!related.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<h3 style="margin-top:18px;font-size:15px">${t('related_products_title')}</h3>
    <div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:4px">
      ${related.map(r => `<div onclick="openProductBySlug('${escapeHtml(r.slug)}')" style="min-width:110px;max-width:110px;cursor:pointer">
        ${r.image_url ? '<img src="'+escapeHtml(r.image_url)+'" style="width:110px;height:110px;object-fit:cover;border-radius:8px">' : '<div class="ph" style="width:110px;height:110px;border-radius:8px">🛍️</div>'}
        <div style="font-size:12px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(r.name)}</div>
        <div style="font-size:12px;font-weight:700">${fmtMoney(r.price, BOUTIQUE.currency)}</div>
      </div>`).join('')}
    </div>`;
}
function loadReviews(productId) {
  api('/shop?action=reviews&slug='+SLUG+'&product_id='+productId).then(({data}) => {
    const rows = data.success ? (data.data||[]) : [];
    const avg = rows.length ? (rows.reduce((s,r)=>s+Number(r.rating),0)/rows.length) : 0;
    const el = document.getElementById('pdReviewsSection');
    if (!el) return;
    el.innerHTML = `<h3 style="margin-top:18px;font-size:15px">${t('reviews_title')} ${rows.length?'('+rows.length+')':''}</h3>
      ${rows.length ? '<div style="color:var(--gray);font-size:13px;margin-bottom:6px">'+'★'.repeat(Math.round(avg))+'☆'.repeat(5-Math.round(avg))+' '+avg.toFixed(1)+'/5</div>' : ''}
      <div style="max-height:160px;overflow-y:auto">
        ${rows.length ? rows.map(r => `<div style="border-bottom:1px solid var(--border);padding:8px 0">
            <div style="font-weight:600;font-size:13px">${escapeHtml(r.customer_name)} — ${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
            ${r.comment ? '<div style="font-size:13px;color:var(--gray)">'+escapeHtml(r.comment)+'</div>' : ''}
          </div>`).join('') : '<div class="empty" style="padding:10px 0">'+t('no_reviews_yet')+'</div>'}
      </div>
      <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="toggleReviewForm('${productId}')">${t('leave_review_btn')}</button>
      <div id="reviewFormWrap"></div>`;
  });
}
function toggleReviewForm(productId) {
  const wrap = document.getElementById('reviewFormWrap');
  if (!wrap) return;
  wrap.innerHTML = `<div style="margin-top:10px">
    <div id="reviewMsg"></div>
    <div class="field"><label>${t('review_name_label')}</label><input id="rvName"></div>
    <div class="field"><label>${t('review_rating_label')}</label><select id="rvRating">
      <option value="5">${t('rating_5')}</option><option value="4">${t('rating_4')}</option>
      <option value="3">${t('rating_3')}</option><option value="2">${t('rating_2')}</option><option value="1">${t('rating_1')}</option>
    </select></div>
    <div class="field"><label>${t('review_comment_label')}</label><textarea id="rvComment" rows="2"></textarea></div>
    <button class="btn btn-primary btn-sm" onclick="submitReview('${productId}')">${t('contact_send_btn')}</button>
  </div>`;
}
function submitReview(productId) {
  const name = document.getElementById('rvName').value.trim();
  if (!name) { document.getElementById('reviewMsg').innerHTML = '<div class="msg error">'+t('review_name_required')+'</div>'; return; }
  post('/shop?action=review_add', {
    slug: SLUG, product_id: productId, customer_name: name,
    rating: Number(document.getElementById('rvRating').value), comment: document.getElementById('rvComment').value.trim(),
  }).then(({data}) => {
    if (!data.success) { document.getElementById('reviewMsg').innerHTML = '<div class="msg error">'+data.message+'</div>'; return; }
    document.getElementById('reviewFormWrap').innerHTML = '<div class="msg success">'+data.message+'</div>';
  });
}
function renderPriceHtml(price, compareAt) {
  const main = '<span style="font-weight:800;font-size:20px;color:var(--blue)">'+fmtMoney(price, BOUTIQUE.currency)+'</span>';
  if (compareAt && Number(compareAt) > Number(price)) {
    return main + ' <span style="color:var(--gray);text-decoration:line-through;font-size:14px">'+fmtMoney(compareAt, BOUTIQUE.currency)+'</span>';
  }
  return main;
}
function stepQty(d) { window.__pdQty = Math.max(1, (window.__pdQty||1)+d); document.getElementById('pdQty').textContent = window.__pdQty; }
function updateVariantPrice(productId) {
  const p = PRODUCTS.find(x=>x.id===productId);
  const sel = document.getElementById('pdVariant');
  const price = sel.value ? Number(sel.selectedOptions[0].dataset.price) : p.price;
  document.getElementById('pdPrice').innerHTML = renderPriceHtml(price, sel.value ? null : p.compare_at_price);
}
// Recompose le nom de variante a partir des options choisies (meme
// convention "Valeur1 / Valeur2" que le generateur cote tableau de bord)
// pour retrouver son prix et son stock, et indique a l'acheteur si cette
// combinaison precise est disponible.
function resolveVariantSelection(productId) {
  const p = PRODUCTS.find(x => x.id === productId);
  let optionGroups = [];
  try { optionGroups = p.options_json ? JSON.parse(p.options_json) : []; } catch(e) {}
  const selected = optionGroups.map((g, gi) => document.getElementById('pdOpt'+gi).value);
  const variant = p.variants.find(v => v.name === selected.join(' / '));
  window.__pdResolvedVariant = variant || null;
  const price = variant && variant.price != null ? Number(variant.price) : Number(p.price);
  document.getElementById('pdPrice').innerHTML = renderPriceHtml(price, variant ? null : p.compare_at_price);
  // Le stock ne bloque jamais la commande cote acheteur (a charge du
  // marchand de s'organiser une fois la commande recue - voir l'alerte de
  // stock bas cote tableau de bord). Seule une combinaison qui n'existe
  // tout simplement pas (aucune variante generee pour ce choix precis, donc
  // aucun prix a facturer) empeche l'ajout au panier.
  const addBtn = document.getElementById('pdAddBtn');
  addBtn.disabled = !variant;
}
function addToCart(productId) {
  const p = PRODUCTS.find(x => x.id === productId);
  let variant = null, variantId = null;
  const flatSel = document.getElementById('pdVariant');
  if (flatSel) {
    variantId = flatSel.value;
    variant = variantId ? p.variants.find(v=>v.id===variantId) : null;
  } else if (window.__pdResolvedVariant) {
    variant = window.__pdResolvedVariant;
    variantId = variant.id;
  }
  const qty = window.__pdQty || 1;
  const key = productId+'|'+(variantId||'');
  const existing = CART.find(l => l.key === key);
  if (existing) { existing.qty += qty; }
  else { CART.push({key, product_id:productId, variant_id:variantId||null, name:p.name+(variant?' - '+variant.name:''), price:variant?(variant.price??p.price):p.price, qty}); }
  saveCart();
  closeOverlay('productOverlay');
  openCart();
}
function closeOverlay(id) { document.getElementById(id).classList.remove('open'); }

function openCart() {
  renderCartSheet();
  document.getElementById('cartOverlay').classList.add('open');
}
// Reproduit exactement la regle appliquee cote serveur (shop_checkout) :
// chaque produit physique peut definir son propre frais de livraison, sinon
// celui de la boutique s'applique ; une commande n'est livree qu'une fois,
// donc on retient le plus eleve plutot que de les additionner. Purement
// pour l'affichage avant validation - le total facture reste toujours
// recalcule cote serveur a la commande.
function computeDeliveryFee() {
  let fee = 0;
  CART.forEach(l => {
    const p = PRODUCTS.find(x => x.id === l.product_id);
    if (!p || Number(p.is_physical) === 0) return;
    const productFee = (p.delivery_fee !== null && p.delivery_fee !== undefined && p.delivery_fee !== '')
      ? Number(p.delivery_fee) : Number(BOUTIQUE.default_delivery_fee || 0);
    fee = Math.max(fee, productFee);
  });
  return fee;
}
let APPLIED_PROMO = null; // {code, type, value, discount} - revalide de toute facon au checkout reel
function cartTotalsHtml(subtotal, deliveryFee) {
  const discount = APPLIED_PROMO ? Math.min(APPLIED_PROMO.discount, subtotal) : 0;
  const total = Math.max(0, subtotal + deliveryFee - discount);
  return `<div class="cart-line"><div>${t('subtotal_label')}</div><div>${fmtMoney(subtotal, BOUTIQUE.currency)}</div></div>
       ${deliveryFee > 0 ? '<div class="cart-line"><div>'+t('delivery_fee_label')+'</div><div>'+fmtMoney(deliveryFee, BOUTIQUE.currency)+'</div></div>' : ''}
       ${discount > 0 ? '<div class="cart-line" style="color:var(--green,#16a34a)"><div>Code '+escapeHtml(APPLIED_PROMO.code)+'</div><div>-'+fmtMoney(discount, BOUTIQUE.currency)+'</div></div>' : ''}
       <div class="cart-total"><div>${t('total_label')}</div><div>${fmtMoney(total, BOUTIQUE.currency)}</div></div>`;
}
function promoFieldHtml() {
  return `<div class="field-row" style="margin:10px 0">
    <input id="promoInput" placeholder="${t('promo_placeholder')}" value="${APPLIED_PROMO?escapeHtml(APPLIED_PROMO.code):''}" ${APPLIED_PROMO?'disabled':''}>
    ${APPLIED_PROMO
      ? '<button class="btn btn-ghost" onclick="removePromoCode()">'+t('promo_remove_btn')+'</button>'
      : '<button class="btn btn-ghost" onclick="applyPromoCode()">'+t('promo_apply_btn')+'</button>'}
  </div><div id="promoMsg"></div>`;
}
// Capture ce que le client a deja tape avant un re-rendu du panier
// (applique/retire un code promo) pour pouvoir le remettre en place -
// renderCartSheet() reconstruit tout le HTML du formulaire, ce qui videait
// sinon nom/telephone/adresse deja saisis.
function checkoutFieldValues() {
  return {
    name: (document.getElementById('coName')||{}).value || '',
    phone: (document.getElementById('coPhone')||{}).value || '',
    address: (document.getElementById('coAddress')||{}).value || '',
    email: (document.getElementById('coEmail')||{}).value || '',
  };
}
function applyPromoCode() {
  const code = document.getElementById('promoInput').value.trim();
  if (!code) return;
  const subtotal = CART.reduce((s,l)=>s+l.price*l.qty, 0);
  const fields = checkoutFieldValues();
  post('/shop?action=validate_promo', {slug:SLUG, code, subtotal, phone:fields.phone}).then(({data}) => {
    const msg = document.getElementById('promoMsg');
    if (!data.success) { if (msg) msg.innerHTML = '<div class="msg error">'+data.message+'</div>'; return; }
    APPLIED_PROMO = data.data;
    renderCartSheet(window.__cartStep||'cart', fields);
  });
}
function removePromoCode() { const fields = checkoutFieldValues(); APPLIED_PROMO = null; renderCartSheet(window.__cartStep||'cart', fields); }

function renderCartSheet(step, prefill) {
  step = step || 'cart';
  prefill = prefill || {};
  window.__cartStep = step;
  const subtotal = CART.reduce((s,l)=>s+l.price*l.qty, 0);
  const deliveryFee = computeDeliveryFee();
  const totalsHtml = cartTotalsHtml(subtotal, deliveryFee);
  if (step === 'cart') {
    document.getElementById('cartSheet').innerHTML = `
      <button class="close" onclick="closeOverlay('cartOverlay')">✕</button>
      <h2>${t('cart_title')}</h2>
      ${CART.length ? CART.map(l => `<div class="cart-line"><div>${escapeHtml(l.name)} × ${l.qty}<br><span style="color:var(--gray)">${fmtMoney(l.price,BOUTIQUE.currency)}</span></div><button onclick="removeFromCart('${l.key}')">✕</button></div>`).join('')
        : '<div class="empty" style="padding:30px 0"><div class="big">🛒</div>'+t('cart_empty')+'</div>'}
      ${CART.length ? totalsHtml+'<button class="btn btn-primary" onclick="renderCartSheet(\'checkout\')">'+t('order_cod_btn')+'</button>' : ''}
    `;
    if (CART.length) trackAbandoned();
  } else if (step === 'checkout') {
    document.getElementById('cartSheet').innerHTML = `
      <button class="close" onclick="closeOverlay('cartOverlay')">✕</button>
      <h2>${t('checkout_title')}</h2>
      <div id="checkoutMsg"></div>
      <div class="field"><label>${t('checkout_fullname_label')}</label><input id="coName" value="${escapeHtml(prefill.name||'')}"></div>
      <div class="field"><label>${t('checkout_phone_label')}</label><input id="coPhone" value="${escapeHtml(prefill.phone||'')}" oninput="onCheckoutPhoneInput()" onblur="trackAbandoned()"></div>
      <div id="personalPromoHint"></div>
      <div class="field"><label>${t('checkout_address_label')}</label><textarea id="coAddress" rows="2">${escapeHtml(prefill.address||'')}</textarea></div>
      <div class="field"><label>${t('checkout_email_label')}</label><input id="coEmail" type="email" value="${escapeHtml(prefill.email||'')}" oninput="onCheckoutPhoneInput()" onblur="trackAbandoned()"></div>
      ${promoFieldHtml()}
      ${totalsHtml}
      <button class="btn btn-primary" id="coSubmitBtn" onclick="submitCheckout()">${t('confirm_order_btn')}</button>
      <button class="btn btn-ghost" style="margin-top:8px" onclick="renderCartSheet('cart')">${t('back_to_cart_btn')}</button>
    `;
  } else if (step === 'confirm') {
    document.getElementById('cartSheet').innerHTML = `
      <button class="close" onclick="closeOverlay('cartOverlay')">✕</button>
      <div class="confirm-box">
        <div class="ic">✓</div>
        <h2>${t('order_confirmed_title')}</h2>
        <p style="color:var(--gray);margin-top:8px">${t('order_ref_label')}<strong>${escapeHtml(window.__lastOrderRef||'')}</strong></p>
        <p style="color:var(--gray)">${t('order_confirmed_note')}</p>
        <button class="btn btn-primary" style="margin-top:16px" onclick="closeOverlay('cartOverlay')">${t('close_btn')}</button>
      </div>
    `;
  }
}
function removeFromCart(key) { CART = CART.filter(l => l.key !== key); saveCart(); renderCartSheet('cart'); }

let abandonedTimer = null, personalPromoTimer = null;
function onCheckoutPhoneInput() {
  clearTimeout(abandonedTimer);
  abandonedTimer = setTimeout(trackAbandoned, 1200);
  clearTimeout(personalPromoTimer);
  const hint = document.getElementById('personalPromoHint');
  if (hint) hint.innerHTML = '';
  personalPromoTimer = setTimeout(checkPersonalPromo, 800);
}
// Des qu'un client tape son telephone, on verifie discretement s'il a un
// code promo qui lui a ete reserve personnellement (voir Marketing ->
// Ciblage cote marchand) et on le lui propose directement - il n'a pas
// besoin de le connaitre a l'avance ni que le marchand l'appelle.
function checkPersonalPromo() {
  const phone = (document.getElementById('coPhone')||{}).value.trim();
  const hint = document.getElementById('personalPromoHint');
  if (!hint) return;
  if (!phone) { hint.innerHTML = ''; return; }
  post('/shop?action=promo_for_phone', {slug:SLUG, phone}).then(({data}) => {
    const rows = (data.success && data.data) || [];
    if (!rows.length || APPLIED_PROMO) { hint.innerHTML = ''; return; }
    hint.innerHTML = rows.map(p => {
      const label = p.type === 'percent' ? Number(p.value)+'%' : fmtMoney(p.value, BOUTIQUE.currency);
      return `<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:9px;padding:8px 10px;margin:8px 0;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span>${t('personal_promo_prefix')}<strong>${escapeHtml(p.code)}</strong> : -${label}${t('personal_promo_suffix')}</span>
        <button class="btn btn-primary btn-sm" onclick="applyDiscoveredPromo('${escapeHtml(p.code)}')" style="width:auto;flex-shrink:0">${t('use_btn')}</button>
      </div>`;
    }).join('');
  });
}
function applyDiscoveredPromo(code) {
  document.getElementById('promoInput').value = code;
  applyPromoCode();
  const hint = document.getElementById('personalPromoHint');
  if (hint) hint.innerHTML = '';
}
function trackAbandoned() {
  const phone = (document.getElementById('coPhone')||{}).value || '';
  const email = (document.getElementById('coEmail')||{}).value || '';
  if (!phone && !email) return;
  const total = CART.reduce((s,l)=>s+l.price*l.qty, 0);
  post('/shop?action=track_abandoned', {slug:SLUG, session_id:sessionId(), phone, email, cart:CART, total});
}

function submitCheckout() {
  const name = document.getElementById('coName').value.trim();
  const phone = document.getElementById('coPhone').value.trim();
  const address = document.getElementById('coAddress').value.trim();
  const email = document.getElementById('coEmail').value.trim();
  if (!name || !phone) { document.getElementById('checkoutMsg').innerHTML = '<div class="msg error">'+t('name_phone_required')+'</div>'; return; }
  if (CART.length === 0) { document.getElementById('checkoutMsg').innerHTML = '<div class="msg error">'+t('cart_empty_error')+'</div>'; return; }
  const btn = document.getElementById('coSubmitBtn'); btn.disabled = true; btn.textContent = t('sending_in_progress');
  const params = new URLSearchParams(window.location.search);
  post('/shop?action=checkout', {
    slug: SLUG, session_id: sessionId(),
    customer: {name, phone, address, email},
    items: CART.map(l => ({product_id:l.product_id, variant_id:l.variant_id, qty:l.qty})),
    utm_source: params.get('utm_source')||'', utm_campaign: params.get('utm_campaign')||'',
    promo_code: APPLIED_PROMO ? APPLIED_PROMO.code : '',
  }).then(({data}) => {
    btn.disabled = false; btn.textContent = t('confirm_order_btn');
    if (!data.success) { document.getElementById('checkoutMsg').innerHTML = '<div class="msg error">'+data.message+'</div>'; return; }
    window.__lastOrderRef = data.data.ref;
    CART = []; saveCart(); APPLIED_PROMO = null;
    renderCartSheet('confirm');
  });
}

function trackStatusLabels() {
  return {pending:t('status_pending'), processing:t('status_processing'), shipped:t('status_shipped'), delivered:t('status_delivered'), refused:t('status_refused'), cancelled:t('status_cancelled')};
}
function trackDeliveryLabels() {
  return {to_assign:t('delivery_to_assign'), assigned:t('delivery_assigned'), in_delivery:t('delivery_in_delivery'), delivered:t('delivery_delivered'), refused:t('delivery_refused')};
}
function openTrackOrder() {
  document.getElementById('trackSheet').innerHTML = `
    <button class="close" onclick="closeOverlay('trackOverlay')">✕</button>
    <h2>${t('track_order_title')}</h2>
    <div id="trackMsg"></div>
    <div class="field"><label>${t('track_phone_label')}</label><input id="trkPhone" oninput="onTrackPhoneInput()"></div>
    <div id="trkOrdersHint"></div>
    <div class="field"><label>${t('track_ref_label')}</label><input id="trkRef" placeholder="CMD-..."></div>
    <button class="btn btn-primary" onclick="submitTrackOrder()">${t('search_btn')}</button>
    <div id="trackResult"></div>
  `;
  document.getElementById('trackOverlay').classList.add('open');
}
// Si le client ne se souvient plus de sa reference, on la lui propose
// directement : des qu'il tape son telephone, ses commandes passees avec ce
// numero s'affichent en liste cliquable (voir shop_orders_for_phone()).
let trackPhoneTimer = null;
function onTrackPhoneInput() {
  clearTimeout(trackPhoneTimer);
  const hint = document.getElementById('trkOrdersHint');
  if (hint) hint.innerHTML = '';
  trackPhoneTimer = setTimeout(loadOrdersForTrackPhone, 500);
}
function loadOrdersForTrackPhone() {
  const phone = document.getElementById('trkPhone').value.trim();
  const hint = document.getElementById('trkOrdersHint');
  if (!hint) return;
  if (!phone) { hint.innerHTML = ''; return; }
  post('/shop?action=orders_for_phone', {slug:SLUG, phone}).then(({data}) => {
    const rows = (data.success && data.data) || [];
    if (!rows.length) { hint.innerHTML = ''; return; }
    hint.innerHTML = '<div class="muted" style="font-size:12px;margin:6px 0 4px">'+t('found_orders_hint')+'</div>' +
      rows.map(o => `<div onclick="selectTrackOrder('${o.ref}')" style="border:1px solid var(--border);border-radius:9px;padding:8px 10px;margin-bottom:6px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:8px">
        <span>${escapeHtml(o.ref)}</span><span style="color:var(--gray)">${fmtMoney(o.total, BOUTIQUE.currency)} — ${trackStatusLabels()[o.status]||o.status}</span>
      </div>`).join('');
  });
}
function selectTrackOrder(ref) {
  document.getElementById('trkRef').value = ref;
  submitTrackOrder();
}
function submitTrackOrder() {
  const ref = document.getElementById('trkRef').value.trim();
  const phone = document.getElementById('trkPhone').value.trim();
  if (!ref || !phone) { document.getElementById('trackMsg').innerHTML = '<div class="msg error">'+t('order_number_phone_required')+'</div>'; return; }
  post('/shop?action=track_order', {slug:SLUG, ref, phone}).then(({data}) => {
    if (!data.success) { document.getElementById('trackMsg').innerHTML = '<div class="msg error">'+data.message+'</div>'; document.getElementById('trackResult').innerHTML=''; return; }
    document.getElementById('trackMsg').innerHTML = '';
    const o = data.data;
    document.getElementById('trackResult').innerHTML = `
      <div style="margin-top:14px;border:1px solid var(--border);border-radius:12px;padding:14px">
        <div><strong>${escapeHtml(o.ref)}</strong> — ${trackStatusLabels()[o.status]||o.status}</div>
        ${o.delivery_status ? '<div style="color:var(--gray);font-size:13px;margin-top:4px">'+t('delivery_label')+(trackDeliveryLabels()[o.delivery_status]||o.delivery_status)+'</div>' : ''}
        ${o.delivery_person_name ? '<div style="color:var(--gray);font-size:13px">'+t('delivery_person_label')+escapeHtml(o.delivery_person_name)+' ('+escapeHtml(o.delivery_person_phone||'')+')</div>' : ''}
        <div style="margin-top:10px">${(o.items||[]).map(it=>'<div style="font-size:13px">'+it.qty+' × '+escapeHtml(it.product_name)+'</div>').join('')}</div>
        <div style="font-weight:700;margin-top:8px">${t('order_total_label')}${fmtMoney(o.total, BOUTIQUE.currency)}</div>
      </div>`;
  });
}
function subscribeNewsletter() {
  const email = document.getElementById('nlEmail').value.trim();
  post('/shop?action=newsletter', {slug:SLUG, email}).then(({data}) => {
    document.getElementById('nlMsg').innerHTML = '<div class="msg '+(data.success?'success':'error')+'">'+data.message+'</div>';
    if (data.success) document.getElementById('nlEmail').value = '';
  });
}
function sendContactMessage() {
  const name = document.getElementById('ctName').value.trim();
  const email = document.getElementById('ctEmail').value.trim();
  const message = document.getElementById('ctMessage').value.trim();
  post('/shop?action=contact_message', {slug:SLUG, name, email, message}).then(({data}) => {
    document.getElementById('ctMsg').innerHTML = '<div class="msg '+(data.success?'success':'error')+'">'+data.message+'</div>';
    if (data.success) { document.getElementById('ctName').value=''; document.getElementById('ctEmail').value=''; document.getElementById('ctMessage').value=''; }
  });
}
</script>
</body>
</html>
