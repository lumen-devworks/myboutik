<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYBOUTIK — Tableau de bord</title>
<style>
  :root{
    --blue:#2563eb; --blue-dark:#1d4ed8; --ink:#0f172a; --gray:#64748b;
    --border:#e2e8f0; --bg:#f8fafc; --green:#16a34a; --green-bg:#ecfdf5;
    --red:#dc2626; --red-bg:#fef2f2; --amber:#d97706; --amber-bg:#fffbeb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
  a{color:inherit;text-decoration:none}
  button,select,input,textarea{font-family:inherit}
  #app{display:flex;height:100vh}

  /* Sidebar : hauteur fixe (100vh), defile independamment du contenu -
     seule la liste de liens (nav.side-nav) scrolle si elle deborde, le
     logo/le selecteur de boutique en haut restent toujours visibles. */
  #sidebar{width:230px;height:100vh;background:#fff;border-right:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column}
  .side-top{padding:16px;border-bottom:1px solid var(--border)}
  .side-top .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin-bottom:10px}
  .side-top .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#3b82f6,#1e40af);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px}
  select#boutiqueSwitch{width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);font-size:13px}
  .side-back{display:block;padding:10px 16px;font-size:13px;color:var(--gray);border-bottom:1px solid var(--border)}
  .side-back:hover{background:var(--bg)}
  nav.side-nav{flex:1;overflow-y:auto;padding:8px}
  .side-group{font-size:11px;text-transform:uppercase;color:var(--gray);font-weight:700;padding:14px 12px 4px}
  .side-link{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;font-size:14px;color:var(--ink);cursor:pointer}
  .side-link:hover{background:var(--bg)}
  .side-link.active{background:#eff6ff;color:var(--blue);font-weight:600}
  .side-sub{padding-left:26px}

  /* Topbar + content : le topbar reste fixe (flex-shrink:0, ne scrolle
     jamais), seul #content defile - meme principe que la barre laterale. */
  #main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden}
  #topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}
  #topbar h1{font-size:16px}
  .top-actions{display:flex;gap:8px;align-items:center}
  #content{padding:24px;flex:1;max-width:1200px;width:100%;margin:0 auto;overflow-y:auto}

  .btn{border:none;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{background:var(--blue-dark)}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--border)}
  .btn-ghost:hover{background:var(--bg)}
  .btn-danger{background:var(--red-bg);color:var(--red)}
  .btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}

  h2.page-title{font-size:22px;margin-bottom:4px}
  .page-sub{color:var(--gray);font-size:14px;margin-bottom:20px}
  .row-between{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
  .kpi{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px}
  .kpi .lbl{font-size:13px;color:var(--gray);display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .kpi .val{font-size:24px;font-weight:800}

  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px}
  .card h3{font-size:15px;margin-bottom:14px}
  .empty{text-align:center;color:var(--gray);font-size:14px;padding:36px 12px}
  .empty .big{font-size:30px;margin-bottom:8px}

  table{width:100%;border-collapse:collapse;font-size:14px}
  table th{text-align:left;color:var(--gray);font-weight:600;font-size:12px;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--border)}
  table td{padding:10px 10px;border-bottom:1px solid var(--border)}
  table tr:last-child td{border-bottom:none}

  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .pill-pending{background:var(--amber-bg);color:var(--amber)}
  .pill-processing,.pill-assigned,.pill-shipped,.pill-in_delivery{background:#eff6ff;color:var(--blue)}
  .pill-delivered{background:var(--green-bg);color:var(--green)}
  .pill-refused,.pill-cancelled{background:var(--red-bg);color:var(--red)}
  .pill-to_assign{background:#f1f5f9;color:var(--gray)}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;font-size:14px}
  .password-wrap{position:relative}
  .password-wrap input{padding-right:40px}
  .pw-toggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;padding:5px;line-height:1}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .tab{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:var(--gray)}
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:28px;max-height:88vh;overflow-y:auto}
  .modal h2{font-size:18px;margin-bottom:16px}
  .modal-actions{display:flex;gap:10px;margin-top:8px}
  .msg{font-size:13px;border-radius:10px;padding:9px 11px;margin-bottom:12px}
  .msg.error{background:var(--red-bg);color:var(--red)}
  .msg.success{background:var(--green-bg);color:#15803d}

  .progress-bar{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:14px 0}
  .progress-bar .fill{height:100%;background:linear-gradient(90deg,#3b82f6,#1d4ed8)}
  .boutique-card{border:1px solid var(--border);border-radius:14px;padding:18px;background:#fff;display:flex;flex-direction:column;gap:10px}
  .grades-list .grade-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
  .grades-list .grade-row:last-child{border-bottom:none}
  .muted{color:var(--gray);font-size:13px}

  #menuToggle{display:none;font-size:18px;padding:6px 10px}
  #sidebarBackdrop{display:none}

  /* Telephones/petites tablettes : la barre laterale devient un tiroir qui
     se superpose au contenu au lieu de lui voler en permanence 230px de
     large - bascule via le bouton ☰ du haut, ou en touchant le fond noir. */
  @media (max-width: 860px) {
    #menuToggle{display:inline-flex;align-items:center;justify-content:center}
    #sidebar{position:fixed;left:0;top:0;z-index:45;transform:translateX(-100%);transition:transform .2s ease;box-shadow:2px 0 12px rgba(0,0,0,.15)}
    #sidebar.open{transform:translateX(0)}
    #sidebarBackdrop.open{display:block;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40}
    #topbar{padding:10px 14px}
    #topbar h1{font-size:14px}
    #content{padding:14px}
    .field-row{grid-template-columns:1fr}
    .kpi-grid{grid-template-columns:1fr 1fr}
    /* Les tableaux larges (finances, commandes...) defilent horizontalement
       au lieu de deborder de l'ecran ou d'ecraser les colonnes. */
    .card table{display:block;overflow-x:auto;white-space:nowrap}
  }
  @media (max-width: 480px) {
    .kpi-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebarBackdrop" onclick="toggleSidebar()"></div>
  <div id="sidebar">
    <div class="side-top">
      <div class="logo"><div class="mark">M</div> MYBOUTIK</div>
      <select id="boutiqueSwitch" onchange="switchBoutique(this.value)"></select>
    </div>
    <a class="side-back" href="#/boutiques" onclick="closeSidebar()">← Toutes mes boutiques</a>
    <a class="side-back" href="../guide.html" target="_blank">📖 Guide d'utilisation</a>
    <nav class="side-nav" id="sideNav"></nav>
  </div>
  <div id="main">
    <div id="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button id="menuToggle" class="btn btn-ghost btn-sm" onclick="toggleSidebar()" aria-label="Menu">☰</button>
        <h1 id="topTitle">Tableau de bord</h1>
      </div>
      <div class="top-actions">
        <span class="muted" id="userEmail"></span>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Se déconnecter</button>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div class="overlay" id="modalOverlay"><div class="modal" id="modalBody"></div></div>

<script src="../config.js"></script>
<script>
const API_URL = window.MYBOUTIK_API_URL || 'http://localhost:8000';
const TOKEN = localStorage.getItem('myboutik_token');
if (!TOKEN) window.location.href = '../index.html';
const USER = JSON.parse(localStorage.getItem('myboutik_user') || '{}');

let BOUTIQUES = [];
let CURRENT = null; // boutique courante {id,slug,name,...}

function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+TOKEN}, opts.headers||{});
  return fetch(API_URL+path, Object.assign({}, opts, {headers}))
    .then(r => r.json().then(data => ({status:r.status, data})).catch(()=>({status:r.status,data:{success:false,message:'Reponse invalide'}})))
    .catch(() => ({status:0, data:{success:false, message:'Impossible de contacter le serveur.'}}))
    .then(res => {
      if (res.status === 401) { logout(); }
      return res;
    });
}
function post(path, body) { return api(path, {method:'POST', body:JSON.stringify(body||{})}); }
// Les exports CSV renvoient un fichier (pas du JSON) et exigent quand meme le
// header Authorization - impossible via un simple <a href>, donc on
// telecharge en fetch() puis on declenche l'enregistrement via un <a> cache
// pointant sur un blob: local.
function downloadCsv(path, filename) {
  fetch(API_URL+path, {headers:{'Authorization':'Bearer '+TOKEN}}).then(r => {
    if (!r.ok) throw new Error('export impossible');
    return r.blob();
  }).then(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }).catch(() => alert('Export impossible. Réessayez plus tard.'));
}
function logout() { localStorage.removeItem('myboutik_token'); localStorage.removeItem('myboutik_user'); window.location.href = '../index.html'; }

function fmtMoney(n, currency) { return Math.round(n||0).toLocaleString('fr-FR') + ' ' + (currency||'FCFA'); }
function fmtDate(iso) { if(!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const STATUS_LABELS = {
  pending:'En attente', processing:'Validée', shipped:'Expédiée', delivered:'Livrée',
  refused:'Refusée', cancelled:'Annulée',
  to_assign:'À assigner', assigned:'Assignée', in_delivery:'En livraison',
};
function pill(status){ return '<span class="pill pill-'+status+'">'+(STATUS_LABELS[status]||status)+'</span>'; }

function openModal(html) { document.getElementById('modalBody').innerHTML = html; document.getElementById('modalOverlay').classList.add('open'); }
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

// ============================================================
// Chargement des boutiques + routeur
// ============================================================
document.getElementById('userEmail').textContent = USER.email || '';

function loadBoutiques() {
  return api('/boutiques?action=list').then(({data}) => {
    if (!data.success) return [];
    BOUTIQUES = data.data;
    const sel = document.getElementById('boutiqueSwitch');
    sel.innerHTML = BOUTIQUES.map(b => '<option value="'+b.slug+'">'+escapeHtml(b.name)+'</option>').join('')
      || '<option value="">Aucune boutique</option>';
    return BOUTIQUES;
  });
}
function switchBoutique(slug) { if (slug) { window.location.hash = '#/'+slug+'/home'; closeSidebar(); } }

function route() {
  const hash = window.location.hash.replace(/^#\/?/, '');
  const parts = hash.split('/').filter(Boolean);
  loadBoutiques().then(() => {
    if (parts[0] !== undefined && parts[0] !== 'boutiques' && BOUTIQUES.some(b => b.slug === parts[0])) {
      CURRENT = BOUTIQUES.find(b => b.slug === parts[0]);
      document.getElementById('boutiqueSwitch').value = CURRENT.slug;
      renderSidebar(CURRENT, parts.slice(1).join('/') || 'home');
      renderSection(CURRENT, parts.slice(1).join('/') || 'home');
    } else {
      CURRENT = null;
      document.getElementById('sideNav').innerHTML = '';
      document.getElementById('topTitle').textContent = 'Mes boutiques';
      renderBoutiquesList();
    }
  });
}
window.addEventListener('hashchange', route);
route();

// ============================================================
// Sidebar
// ============================================================
const NAV = [
  {group:'', items:[['home','🏠','Accueil'], ['grade','🏆','Mon grade']]},
  {group:'Ventes', items:[['orders','🛒','Commandes'], ['orders/delivery','🚚','Livraisons'], ['orders/abandoned','📥','Commandes abandonnées']]},
  {group:'Clients', items:[['customers','👤','Liste des clients'], ['contacts','📇','Carnet d\'adresses']]},
  {group:'Finances', items:[['finance/overview','👁️','Vue Globale'], ['finance/accounts','📖','Livre de Compte'],
    ['finance/delivery-fees','🚛','Frais de livraison'], ['finance/detail','⏱️','Finance Détaillée'], ['finance/ads','📣','Publicités & ROAS']]},
  {group:'Catalogue', items:[['products','📦','Produits'], ['products/stock','📊','Stock'], ['products/suppliers','🚛','Fournisseurs'], ['products/supplier-orders','🧾','Commandes fournisseurs']]},
  {group:'Analytique', items:[['analytics/reports','📈','Rapports'], ['analytics/live','🔴','Live'], ['analytics/history','🕒','Historique']]},
  {group:'Marketing', items:[['marketing','✉️','Messages et abonnés']]},
  {group:'Paramètres', items:[
    ['settings','⚙️','Général'], ['team','🧑‍🤝‍🧑','Équipe'], ['integrations','🔌','Intégrations'],
    ['profile','👤','Mon profil'], ['billing','💳','Abonnement'], ['affiliate','🤝','Affiliation'],
  ]},
];
// Module dont depend chaque page (voir ROLE_MODULE_ACCESS cote backend,
// meme repartition) - '*' = toujours visible, 'admin' = proprietaire/admin
// de la boutique seulement, 'account' = toujours visible (concerne le
// compte connecte, pas la boutique affichee).
const NAV_MODULE = {
  home:'*', grade:'*',
  orders:'orders', 'orders/delivery':'deliveries', 'orders/abandoned':'orders',
  customers:'customers', contacts:'contacts',
  'finance/overview':'finance', 'finance/accounts':'finance', 'finance/delivery-fees':'finance', 'finance/detail':'finance', 'finance/ads':'finance',
  products:'products', 'products/stock':'products', 'products/suppliers':'products', 'products/supplier-orders':'products',
  'analytics/reports':'analytics', 'analytics/live':'analytics', 'analytics/history':'admin',
  marketing:'marketing',
  settings:'admin', team:'admin', integrations:'admin',
  profile:'account', billing:'account', affiliate:'account',
};
const ROLE_MODULE_ACCESS_CLIENT = {
  manager: ['orders','deliveries','customers','contacts','finance','products','analytics','marketing'],
  closeuse: ['orders','customers','products'],
  comptable: ['finance','analytics'],
  livreur: ['deliveries'],
};
function navItemVisible(role, key) {
  const need = NAV_MODULE[key];
  if (need === '*' || need === 'account') return true;
  if (role === 'owner' || role === 'admin') return true;
  if (need === 'admin') return false;
  return (ROLE_MODULE_ACCESS_CLIENT[role] || []).includes(need);
}
function renderSidebar(bt, current) {
  const role = bt.my_role || 'owner';
  document.getElementById('sideNav').innerHTML = NAV.map(g => {
    const items = g.items.filter(([key]) => navItemVisible(role, key));
    if (!items.length) return '';
    return (g.group ? '<div class="side-group">'+g.group+'</div>' : '') +
      items.map(([key,icon,label]) =>
        '<a class="side-link'+(current===key?' active':'')+'" href="#/'+bt.slug+'/'+key+'" onclick="closeSidebar()">'+icon+' '+label+'</a>'
      ).join('');
  }).join('');
}
// Tiroir mobile (voir la media query @max-width:860px) - sans effet sur
// desktop ou la barre laterale reste de toute facon visible en permanence.
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
}

// ============================================================
// Vue "Mes boutiques"
// ============================================================
// Agrege les stats deja chargees par boutique (voir loadBoutiques()) - pas
// besoin d'un nouvel appel serveur, tout est deja en memoire cote client.
// Les montants sont regroupes par devise plutot que sommes en vrac : deux
// boutiques en XOF et FCFA-ailleurs ne doivent jamais se retrouver
// additionnees dans un seul total trompeur.
function renderMultiBoutiqueSummary() {
  if (BOUTIQUES.length < 2) return '';
  const totalCommandes = BOUTIQUES.reduce((s,b)=>s+Number(b.stats.commandes),0);
  const totalEnAttente = BOUTIQUES.reduce((s,b)=>s+Number(b.stats.en_attente),0);
  const byCurrency = {};
  BOUTIQUES.forEach(b => { byCurrency[b.currency] = (byCurrency[b.currency]||0) + Number(b.stats.ca_encaisse); });
  const totalsHtml = Object.entries(byCurrency).map(([cur,amt]) => fmtMoney(amt, cur)).join(' + ');
  return `<div class="card">
    <h3>Vue d'ensemble — toutes boutiques</h3>
    <div class="kpi-grid">
      <div class="kpi"><div class="lbl">Boutiques</div><div class="val">${BOUTIQUES.length}</div></div>
      <div class="kpi"><div class="lbl">Commandes (total)</div><div class="val">${totalCommandes}</div></div>
      <div class="kpi"><div class="lbl">En attente</div><div class="val">${totalEnAttente}</div></div>
      <div class="kpi"><div class="lbl">Revenus encaissés (total)</div><div class="val">${totalsHtml}</div></div>
    </div>
  </div>`;
}
function renderBoutiquesList() {
  const html = `
    <div class="row-between">
      <div><h2 class="page-title">Mes boutiques</h2><div class="page-sub">Choisissez la boutique à gérer, ou lancez-en une nouvelle.</div></div>
      <button class="btn btn-primary" onclick="openCreateBoutique()">+ Créer une boutique</button>
    </div>
    ${renderMultiBoutiqueSummary()}
    <div id="boutiquesGrid" class="kpi-grid"></div>
  `;
  document.getElementById('content').innerHTML = html;
  const grid = document.getElementById('boutiquesGrid');
  if (BOUTIQUES.length === 0) {
    grid.innerHTML = '<div class="card empty" style="grid-column:1/-1"><div class="big">🏬</div>Aucune boutique pour le moment.<br><br><button class="btn btn-primary" onclick="openCreateBoutique()">Créer ma première boutique</button></div>';
    return;
  }
  grid.innerHTML = BOUTIQUES.map(b => `
    <div class="boutique-card">
      <div style="font-weight:700">${escapeHtml(b.name)}</div>
      <div class="muted">/${escapeHtml(b.slug)}</div>
      <div style="display:flex;gap:16px;font-size:13px;color:var(--gray)">
        <div><strong style="color:var(--ink)">${b.stats.commandes}</strong> commandes</div>
        <div><strong style="color:var(--ink)">${b.stats.en_attente}</strong> en attente</div>
      </div>
      <div style="font-weight:700">${fmtMoney(b.stats.ca_encaisse, b.currency)}</div>
      <a class="btn btn-primary btn-sm" style="text-align:center" href="#/${b.slug}/home">Gérer →</a>
    </div>
  `).join('');
}

function openCreateBoutique() {
  openModal(`
    <h2>Créer une boutique</h2>
    <div id="createBoutiqueMsg"></div>
    <div class="field"><label>Nom de la boutique</label><input id="newBoutiqueName" placeholder="Ex: Boutik de Rom"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="submitCreateBoutique()">Créer</button>
    </div>
  `);
}
function submitCreateBoutique() {
  const name = document.getElementById('newBoutiqueName').value.trim();
  if (!name) return;
  post('/boutiques?action=create', {name}).then(({data}) => {
    if (!data.success) { document.getElementById('createBoutiqueMsg').innerHTML = '<div class="msg error">'+data.message+'</div>'; return; }
    closeModal();
    loadBoutiques().then(() => { window.location.hash = '#/'+data.data.slug+'/home'; });
  });
}

// ============================================================
// Aiguillage des sections d'une boutique
// ============================================================
function renderSection(bt, section) {
  document.getElementById('topTitle').textContent = bt.name;
  const map = {
    'home': renderHome, 'grade': renderGrade,
    'orders': renderOrders, 'orders/delivery': renderDeliveries, 'orders/abandoned': renderAbandoned,
    'customers': renderCustomers, 'contacts': renderContacts,
    'finance/overview': renderFinanceOverview, 'finance/accounts': renderFinanceAccounts,
    'finance/delivery-fees': renderFinanceDeliveryFees, 'finance/detail': renderFinanceDetail, 'finance/ads': renderFinanceAds,
    'products': renderProducts, 'products/stock': renderStock, 'products/suppliers': renderSuppliers, 'products/supplier-orders': renderSupplierOrders,
    'analytics/reports': renderReports, 'analytics/live': renderLive, 'analytics/history': renderHistory,
    'marketing': renderMarketing, 'settings': renderSettings,
    'team': renderTeam, 'profile': renderProfile, 'billing': renderBilling,
    'integrations': renderIntegrations, 'affiliate': renderAffiliate,
  };
  (map[section] || renderHome)(bt);
}

function renderOrdersTable(rows, bt, compact) {
  if (!rows.length) return '<div class="empty"><div class="big">🛍️</div>Aucune commande pour l\'instant.</div>';
  return `<table><thead><tr><th>Réf</th><th>Client</th><th>Total</th><th>Statut</th>${compact?'':'<th>Date</th><th></th><th></th>'}</tr></thead><tbody>
    ${rows.map(o => `<tr>
      <td>${escapeHtml(o.ref)}</td><td>${escapeHtml(o.customer_name)}<br><span class="muted">${escapeHtml(o.customer_phone)}</span></td>
      <td>${fmtMoney(o.total, bt.currency)}</td><td>${pill(o.status)}</td>
      ${compact?'':'<td>'+fmtDate(o.created_at)+'</td><td>'+orderStatusSelect(o)+'</td><td><button class="btn btn-ghost btn-sm" onclick="printOrderBordereau(\''+o.id+'\')">🖨️ Bordereau</button></td>'}
    </tr>`).join('')}
  </tbody></table>`;
}
function orderStatusSelect(o) {
  const opts = ['pending','processing','shipped','delivered','refused','cancelled'];
  return '<select onchange="updateOrderStatus(\''+o.id+'\',this.value)" style="padding:5px 8px;border:1px solid var(--border);border-radius:7px;font-size:12px">'
    + opts.map(s => '<option value="'+s+'" '+(s===o.status?'selected':'')+'>'+STATUS_LABELS[s]+'</option>').join('') + '</select>';
}
function updateOrderStatus(id, status) {
  post('/orders?action=update_status', {boutique_id:CURRENT.id, id, status}).then(() => route());
}

// Bordereau imprimable a remettre au livreur : recu dans une fenetre a part

        <td class="num">${fmtMoney(it.unit_price*it.qty, CURRENT.currency)}</td>

    const discount = Number(o.discount_amount||0);
    const win = window.open('', '_blank', 'width=700,height=750');
    win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Facture ${escapeHtml(o.ref)}</title>
      <style>
        body{font-family:Arial,sans-serif;font-size:13px;color:#111;padding:28px;max-width:680px;margin:0 auto}
        h1{font-size:18px;margin:0 0 2px}
        .muted{color:#666;font-size:12px}

        table{width:100%;border-collapse:collapse;margin:10px 0}
        th{padding:5px 8px;border-bottom:2px solid #333;font-size:11px;text-align:left;text-transform:uppercase;color:#555;white-space:nowrap}
        td{padding:6px 8px;border-bottom:1px solid #eee;font-size:13px;text-align:left}
        td.num, th.num{text-align:right;white-space:nowrap}
        .totals td{border-bottom:none;padding:3px 8px}
        .totals .grand td{border-top:2px solid #333;font-size:16px;font-weight:bold;padding-top:8px}
        .box{border:1px solid #ccc;border-radius:8px;padding:10px;margin:10px 0}
        .label{color:#666;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
      </style></head><body>
      <div class="head-row">
        <div><h1>${escapeHtml(CURRENT.name)}</h1><div class="muted">Facture / Bordereau de livraison</div></div>
        <div style="text-align:right">
          <div><strong>${escapeHtml(o.ref)}</strong></div>
          <div class="muted">${fmtDate(o.created_at)}</div>
        </div>
      </div>
      <div class="box">
        <div class="label">Client</div>
        <div><strong>${escapeHtml(o.customer_name)}</strong></div>
        <div>${escapeHtml(o.customer_phone)}</div>
        <div>${escapeHtml(o.customer_address||'')}</div>
      </div>
      ${d.delivery_person_name ? `<div class="box"><div class="label">Livreur</div><div>${escapeHtml(d.delivery_person_name)}</div><div>${escapeHtml(d.delivery_person_phone||'')}</div></div>` : ''}
      <table>
        <thead><tr><th>Article</th><th style="text-align:center">Qté</th><th class="num">Prix unt</th><th class="num">Montant</th></tr></thead>
        <tbody>${itemsHtml}</tbody>
      </table>
      <table class="totals">
        <tr><td>Sous-total</td><td class="num">${fmtMoney(o.subtotal, CURRENT.currency)}</td></tr>
        <tr><td>Frais de livraison</td><td class="num">${fmtMoney(o.delivery_fee_charged, CURRENT.currency)}</td></tr>
        ${discount > 0 ? '<tr><td>Remise'+(o.promo_code?' ('+escapeHtml(o.promo_code)+')':'')+'</td><td class="num">-'+fmtMoney(discount, CURRENT.currency)+'</td></tr>' : ''}
        <tr class="grand"><td>À encaisser</td><td class="num">${fmtMoney(o.total, CURRENT.currency)}</td></tr>
      </table>
      <div class="muted" style="margin-top:14px">Paiement à la livraison (COD). Merci de vérifier le montant avec le client avant remise du colis.</div>
      <script>window.onload = () => window.print();<\/script>
      </body></html>`);
    win.document.close();
  });
}
// Ouvre un rapport mis en forme dans un nouvel onglet et lance
// l'impression - meme mecanisme que le bordereau ci-dessus : le
// navigateur propose "Enregistrer en PDF" comme destination d'impression,
// ce qui donne un vrai PDF deja mis en page sans bibliotheque serveur.
function openPrintReport(title, subtitle, bodyHtml) {
  const win = window.open('', '_blank', 'width=800,height=900');
  win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${escapeHtml(title)}</title>
    <style>
      body{font-family:Arial,sans-serif;color:#111;padding:24px;max-width:760px;margin:0 auto}
      h1{font-size:20px;margin:0 0 2px}
      .muted{color:#666;font-size:13px;margin-bottom:18px}

      th,td{padding:6px 8px;border-bottom:1px solid #ddd;text-align:left}
      th{background:#eff6ff}
      .kpis{display:flex;gap:12px;margin:14px 0}
      .kpi{flex:1;border:1px solid #ddd;border-radius:8px;padding:10px}
      .kpi .lbl{color:#666;font-size:11px;text-transform:uppercase}
      .kpi .val{font-size:18px;font-weight:bold}
    </style></head><body>
    <h1>${escapeHtml(CURRENT.name)}</h1>
    <div class="muted">${escapeHtml(title)} — ${escapeHtml(subtitle)}</div>
    ${bodyHtml}
    <script>window.onload = () => window.print();<\/script>
    </body></html>`);
  win.document.close();
}

function renderOrders(bt) {
  document.getElementById('content').innerHTML = '<div class="empty">Chargement…</div>';

}
function loadOrdersView(bt, status, q) {
  api('/orders?action=list&boutique_id='+bt.id+'&status='+encodeURIComponent(status)+'&q='+encodeURIComponent(q)).then(({data}) => {
    const rows = data.data || [];
    document.getElementById('content').innerHTML = `
      <div class="row-between">
        <div><h2 class="page-title">Commandes</h2><div class="page-sub">Gérer toutes vos commandes COD</div></div>
        <button class="btn btn-primary" onclick="openNewOrder()">+ Nouvelle commande</button>
      </div>
      <div class="card">
        <div class="field-row" style="margin-bottom:14px">
          <input id="ordersSearch" placeholder="Rechercher (réf, nom, téléphone)…" value="${escapeHtml(q)}">
          <select id="ordersStatus" onchange="loadOrdersView(CURRENT,this.value,document.getElementById('ordersSearch').value)">
            ${['','pending','processing','shipped','delivered','refused','cancelled'].map(s=>'<option value="'+s+'" '+(s===status?'selected':'')+'>'+(s?STATUS_LABELS[s]:'Toutes')+'</option>').join('')}
          </select>
        </div>
        ${renderOrdersTable(rows, bt, false)}
      </div>

    document.getElementById('ordersSearch').addEventListener('keydown', e => { if (e.key==='Enter') loadOrdersView(bt, document.getElementById('ordersStatus').value, e.target.value); });
  });
}
function openNewOrder() {
  api('/products?action=list&boutique_id='+CURRENT.id).then(({data}) => {
    const products = (data.data||[]).filter(p=>p.status==='active');
    openModal(`
      <h2>Nouvelle commande</h2>
      <div id="newOrderMsg"></div>
      <div class="field"><label>Nom du client</label><input id="ordCustName"></div>
      <div class="field"><label>Téléphone</label><input id="ordCustPhone"></div>
      <div class="field"><label>Adresse</label><input id="ordCustAddress"></div>
      <div class="field"><label>Produit</label>
        <select id="ordProduct">${products.map(p=>'<option value="'+p.id+'" data-price="'+p.price+'">'+escapeHtml(p.name)+' — '+fmtMoney(p.price,CURRENT.currency)+'</option>').join('')}</select>
      </div>
      <div class="field-row">
        <div class="field"><label>Quantité</label><input id="ordQty" type="number" min="1" value="1"></div>
        <div class="field"><label>Frais de livraison</label><input id="ordDeliveryFee" type="number" min="0" value="${CURRENT.default_delivery_fee||0}"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
        <button class="btn btn-primary" onclick="submitNewOrder()">Créer la commande</button>
      </div>
    `);
  });
}
function submitNewOrder() {
  const sel = document.getElementById('ordProduct');
  if (!sel.value) { document.getElementById('newOrderMsg').innerHTML = '<div class="msg error">Ajoutez au moins un produit actif avant de créer une commande.</div>'; return; }
  const payload = {
    boutique_id: CURRENT.id,
    customer_name: document.getElementById('ordCustName').value.trim(),
    customer_phone: document.getElementById('ordCustPhone').value.trim(),
    customer_address: document.getElementById('ordCustAddress').value.trim(),
    delivery_fee: Number(document.getElementById('ordDeliveryFee').value||0),
    items: [{product_id: sel.value, qty: Number(document.getElementById('ordQty').value||1)}],
  };
  post('/orders?action=create', payload).then(({data}) => {
    if (!data.success) { document.getElementById('newOrderMsg').innerHTML = '<div class="msg error">'+data.message+'</div>'; return; }
    closeModal(); route();
  });
}

function filterDeliveries(status) {

}
function renderDeliveriesTable(rows, bt, persons) {
  if (!rows.length) return '<div class="empty"><div class="big">📦</div>Aucune commande dans cette catégorie.</div>';
  const activePersons = persons.filter(p=>p.active);
  return `<table><thead><tr><th>Réf</th><th>Client</th><th>Statut</th><th>Livreur</th><th></th></tr></thead><tbody>
    ${rows.map(r => `<tr>
      <td>${escapeHtml(r.ref)}</td><td>${escapeHtml(r.customer_name)}<br><span class="muted">${escapeHtml(r.customer_address||'')}</span></td>
      <td>${pill(r.status)}</td>
      <td>${r.status==='to_assign' ? '<select onchange="assignDelivery(\''+r.order_id+'\',this.value)"><option value="">Choisir…</option>'+activePersons.map(p=>'<option value="'+p.id+'">'+escapeHtml(p.name)+'</option>').join('')+'</select>' : escapeHtml(r.delivery_person_name||'—')}</td>
      <td>${deliveryStatusSelect(r)}</td>
    </tr>`).join('')}
  </tbody></table>`;
}
function deliveryStatusSelect(r) {
  const opts = ['to_assign','assigned','in_delivery','delivered','refused'];
  return '<select onchange="updateDeliveryStatus(\''+r.order_id+'\',this.value)" style="padding:5px 8px;border:1px solid var(--border);border-radius:7px;font-size:12px">'
    + opts.map(s=>'<option value="'+s+'" '+(s===r.status?'selected':'')+'>'+STATUS_LABELS[s]+'</option>').join('') + '</select>';
}
function assignDelivery(orderId, personId) { if(!personId) return; post('/deliveries?action=assign', {boutique_id:CURRENT.id, order_id:orderId, delivery_person_id:personId}).then(()=>route()); }

function submitDeliveryPersonForm(id) {
  const name = document.getElementById('dpName').value.trim();
  const phone = document.getElementById('dpPhone').value.trim();
  if (!name || !phone) { document.getElementById('dpMsg').innerHTML = '<div class="msg error">Nom et téléphone requis</div>'; return; }
  const payload = {
    boutique_id: CURRENT.id, name, phone,
    email: document.getElementById('dpEmail').value.trim(),
    vehicle_type: document.getElementById('dpVehicle').value,
    plate_number: document.getElementById('dpPlate').value.trim(),
    photo_url: document.getElementById('dpPhoto').value.trim(),
    notes: document.getElementById('dpNotes').value.trim(),
  };
  let action = '/deliveries?action=person_create';
  if (id) { action = '/deliveries?action=person_update'; payload.id = id; payload.active = document.getElementById('dpActive').checked; }
  post(action, payload).then(({data}) => {
    if (!data.success) { document.getElementById('dpMsg').innerHTML = '<div class="msg error">'+data.message+'</div>'; return; }
    closeModal(); route();
  });
}

// Le nom de campagne dans le lien doit rester EXACTEMENT tel que tape (pas
// de mise en minuscule/normalisation) : c'est cette meme valeur qui est
// comparee cote serveur (orders.utm_campaign) a ad_expenses.campaign_name
// pour calculer le ROAS - la moindre difference casserait le rattachement.
// productSlug n'est ajoute (&p=) que pour un seul produit precis : un lien
// ne peut ouvrir qu'une seule fiche a la fois, donc pour 0 ou plusieurs
// produits on renvoie vers la boutique entiere (le suivi par campagne
// fonctionne quand meme, quel que soit le produit achete).
function buildAdLink(campaignName, productSlug) {
  if (!campaignName) return '';
  const base = window.location.origin + window.location.pathname.replace(/dashboard\/.*/, '') + 'store/index.html?b=' + encodeURIComponent(CURRENT.slug);
  const p = productSlug ? '&p=' + encodeURIComponent(productSlug) : '';
  return base + p + '&utm_campaign=' + encodeURIComponent(campaignName);
}
function selectedAdProductChecks() {
  return Array.from(document.querySelectorAll('.adProductCheck:checked'));
}
function updateAdCampaignLink() {
  const name = document.getElementById('adCampaign').value.trim();
  const checked = selectedAdProductChecks();
  const slug = checked.length === 1 ? checked[0].dataset.slug : '';
  const link = buildAdLink(name, slug);
  const field = document.getElementById('adLinkField');
  const hint = document.getElementById('adLinkHint');
  if (hint) hint.textContent = checked.length > 1
    ? checked.length+' produits sélectionnés — le lien renvoie vers la boutique entière, le suivi se fait par campagne.'
    : 'Collez ce lien comme destination de votre publicité.';
  field.style.display = link ? 'block' : 'none';
  if (link) document.getElementById('adLinkInput').value = link;
}
function copyGeneratedAdLink(campaignName, productSlug) {
  const link = buildAdLink(campaignName, productSlug);
  navigator.clipboard && navigator.clipboard.writeText(link);
}
function submitAddAdExpense() {
  const amount = Number(document.getElementById('adAmount').value||0); if (amount<=0) return;
  const product_ids = selectedAdProductChecks().map(c=>c.value);
  post('/finance?action=ad_expense_create', {boutique_id:CURRENT.id, amount, campaign_name:document.getElementById('adCampaign').value.trim(), product_ids}).then(()=>{closeModal(); route();});
}

function stockBadge(p) {

  const orderBtn = ' <button class="btn btn-ghost btn-sm" onclick="goReorder(\''+p.id+'\')">Commander</button>';
  if (qty <= 0) return '<span class="pill pill-refused">'+qty+' · rupture</span>'+orderBtn;
  if (qty <= threshold) return '<span class="pill pill-pending">'+qty+' · limité</span>'+orderBtn;
  return qty;
}

// Etiquettes (tags) plutot qu'un champ texte libre "separe par des virgules"
// - ambigu et source d'erreur (un merchant qui tape des espaces ou des
// points-virgules se retrouvait avec une seule "valeur" fourre-tout au lieu
// de plusieurs tailles/couleurs distinctes). Entree ou virgule valident une
// etiquette, Retour arriere sur un champ vide supprime la derniere.
function handleOptionTagInput(e, rowIndex) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = e.target.value.trim().replace(/,$/, '');
    if (val) {
      if (!window.__optionRows[rowIndex].values) window.__optionRows[rowIndex].values = [];
      if (!window.__optionRows[rowIndex].values.includes(val)) window.__optionRows[rowIndex].values.push(val);
      renderOptionRows();
      focusOptionRowInput(rowIndex);
    } else {
      e.target.value = '';
    }
  } else if (e.key === 'Backspace' && e.target.value === '') {
    const vals = window.__optionRows[rowIndex].values || [];
    if (vals.length) { vals.pop(); renderOptionRows(); focusOptionRowInput(rowIndex); }
  }
}
function removeOptionTag(rowIndex, tagIndex) {
  window.__optionRows[rowIndex].values.splice(tagIndex, 1);
  renderOptionRows();
}
function focusOptionRowInput(rowIndex) {
  const input = document.querySelector('#optionRows input[data-option-row="'+rowIndex+'"]');
  if (input) input.focus();
}
// Genere le produit cartesien des valeurs de chaque option (ex: Taille
// S/M/L x Couleur Rouge/Bleu -> 6 variantes "S / Rouge", "S / Bleu", ...).
// Les variantes deja existantes portant le meme nom conservent leur prix et
// leur stock au lieu d'etre reinitialisees a chaque regeneration.
function generateVariants() {
  const groups = window.__optionRows.filter(r => r.name.trim() && r.values && r.values.length);
  if (!groups.length) { alert('Renseignez au moins une option avec des valeurs (ex: Taille -> S, M, L)'); return; }
  const combos = groups.reduce((acc, g) => {
    const next = [];
    acc.forEach(comboArr => g.values.forEach(v => next.push([...comboArr, v])));
    return next;
  }, [[]]);
  const existing = {};
  window.__productVariants.forEach(v => existing[v.name] = v);
  window.__productVariants = combos.map(comboArr => {
    const name = comboArr.join(' / ');
    return existing[name] || {name, price:'', stock_qty:0};
  });
  renderVariantsTable();
}
function renderVariantsTable() {
  const rows = window.__productVariants;
  document.getElementById('variantsTableWrap').innerHTML = rows.length ? `
    <label>Variantes générées (${rows.length})</label>
    <table><thead><tr><th>Variante</th><th>Prix (optionnel)</th><th>Stock</th><th></th></tr></thead><tbody>
    ${rows.map((v,i)=>`<tr>
      <td>${escapeHtml(v.name)}</td>
      <td><input type="number" min="0" value="${v.price??''}" style="width:90px" oninput="window.__productVariants[${i}].price=this.value"></td>
      <td><input type="number" min="0" value="${v.stock_qty||0}" style="width:70px" oninput="window.__productVariants[${i}].stock_qty=Number(this.value||0)"></td>
      <td><button type="button" class="btn btn-ghost btn-sm" onclick="removeVariantRow(${i})">✕</button></td>
    </tr>`).join('')}
    </tbody></table>` : '';
}

// Redimensionne/compresse une photo cote navigateur avant de l'envoyer -
// evite d'avoir a heberger les images ailleurs (pas de compte S3/Cloudinary
// a configurer) : elles sont stockees en base64 directement en base (colonne
// TEXT/product_images.data, aucune limite pratique pour un petit catalogue).
function resizeImageToDataUrl(file, maxDim, cb) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.8));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function handleNewProductImageFile(input) {
  // Un seul emplacement disponible avant la creation du produit (products.
  // image_url) - si plusieurs fichiers sont choisis ici, seul le premier est
  // utilise ; les autres pourront etre ajoutes juste apres via la galerie.
  const file = input.files[0];
  if (!file) return;
  resizeImageToDataUrl(file, 900, dataUrl => { document.getElementById('prodImage').value = dataUrl; });
}
function addProductImage(input) {
  const files = Array.from(input.files || []);
  if (!files.length) return;
  const productId = window.__editingProductId;
  let chain = Promise.resolve();
  files.forEach(file => {
    chain = chain.then(() => new Promise(resolve => {
      resizeImageToDataUrl(file, 900, dataUrl => {
        post('/products?action=image_add', {boutique_id:CURRENT.id, product_id:productId, data:dataUrl}).then(resolve);
      });
    }));
  });
  chain.then(() => openProductForm(productId));
}

        <div class="card"><h3>Flux d'activité</h3>${L.activite.length ? L.activite.map(a=>'<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13px"><span class="muted">'+fmtDate(a.created_at)+'</span> — '+escapeHtml(a.message)+'</div>').join('') : '<div class="empty">Aucune commande pour l\'instant.</div>'}</div>
      `;
    });
  }
  load();
  clearInterval(window.__liveInterval);
  window.__liveInterval = setInterval(() => { if ((window.location.hash||'').endsWith('analytics/live')) load(); else clearInterval(window.__liveInterval); }, 30000);
}

// prefillPhone : arrive depuis "Clients a relancer" (page Clients) pour

function openPromoForm(prefillPhone) {
  openModal(`<h2>Nouveau code promo</h2>
    <div id="promoMsg"></div>
    <div class="field"><label>Code</label><input id="promoCode" placeholder="Ex: PROMO10" style="text-transform:uppercase"></div>
    <div class="field-row">
      <div class="field"><label>Type</label><select id="promoType"><option value="percent">Pourcentage (%)</option><option value="amount">Montant fixe</option></select></div>
      <div class="field"><label>Valeur</label><input id="promoValue" type="number" min="1"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Nombre d'utilisations max (optionnel)</label><input id="promoMaxUses" type="number" min="1"></div>
      <div class="field"><label>Expire le (optionnel)</label><input id="promoExpires" type="date"></div>
    </div>
    <div class="field"><label>Réserver à des clients précis (optionnel)</label>
      <textarea id="promoTargets" rows="3" placeholder="Un numéro de téléphone par ligne, ex:&#10;+225 07 00 00 00 00&#10;+225 05 45 93 76 65">${escapeHtml(prefillPhone||'')}</textarea>
      <div class="muted" style="font-size:12px;margin-top:4px">Laissez vide pour un code ouvert à tous vos clients. Sinon, seuls les numéros listés ici pourront l'utiliser — même si quelqu'un d'autre l'obtient par un tiers.</div>

function parsePromoTargets(text) {
  return text.split('\n').map(s=>s.trim()).filter(Boolean);
}
function submitPromoForm() {
  const code = document.getElementById('promoCode').value.trim();
  const value = Number(document.getElementById('promoValue').value||0);
  if (!code || value<=0) { document.getElementById('promoMsg').innerHTML = '<div class="msg error">Code et valeur requis</div>'; return; }
  post('/marketing?action=promo_create', {
    boutique_id: CURRENT.id, code, type: document.getElementById('promoType').value, value,
    max_uses: document.getElementById('promoMaxUses').value || null,
    expires_at: document.getElementById('promoExpires').value || null,
    target_phones: parsePromoTargets(document.getElementById('promoTargets').value),
  }).then(({data}) => {
    if (!data.success) { document.getElementById('promoMsg').innerHTML = '<div class="msg error">'+escapeHtml(data.message)+'</div>'; return; }
    closeModal(); route();
  });
}

function openPromotionForm(pr) {
  pr = pr || {};
  const selectedIds = (pr.products || []).map(x => x.id);
  const products = window.__marketingProducts || [];
  openModal(`<h2>${pr.id ? 'Modifier la promotion' : 'Nouvelle promotion produit'}</h2>
    <div id="promotionMsg"></div>
    <div class="field-row">
      <div class="field"><label>Type</label><select id="promotionType"><option value="percent" ${pr.type!=='amount'?'selected':''}>Pourcentage (%)</option><option value="amount" ${pr.type==='amount'?'selected':''}>Montant fixe</option></select></div>
      <div class="field"><label>Valeur</label><input id="promotionValue" type="number" min="1" value="${pr.value||''}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Début (optionnel)</label><input id="promotionStarts" type="date" value="${pr.starts_at?pr.starts_at.substring(0,10):''}"></div>
      <div class="field"><label>Fin (optionnel)</label><input id="promotionExpires" type="date" value="${pr.expires_at?pr.expires_at.substring(0,10):''}"></div>
    </div>
    <div class="field">
      <label>Produits concernés</label>
      <div style="max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:9px;padding:8px">
        ${products.length ? products.map(p => `<label style="display:flex;align-items:center;gap:8px;padding:3px 0">
          <input type="checkbox" class="promotionProductCheck" style="width:auto;flex-shrink:0" value="${p.id}" ${selectedIds.includes(p.id)?'checked':''}> <span>${escapeHtml(p.name)}</span>
        </label>`).join('') : '<div class="muted">Ajoutez des produits à votre catalogue avant de créer une promotion.</div>'}
      </div>
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="submitPromotionForm('${pr.id||''}')">${pr.id?'Enregistrer':'Créer'}</button></div>`);
}
function submitPromotionForm(id) {
  const value = Number(document.getElementById('promotionValue').value||0);
  const product_ids = Array.from(document.querySelectorAll('.promotionProductCheck:checked')).map(c=>c.value);
  if (value<=0) { document.getElementById('promotionMsg').innerHTML = '<div class="msg error">La valeur est requise</div>'; return; }
  if (!product_ids.length) { document.getElementById('promotionMsg').innerHTML = '<div class="msg error">Sélectionnez au moins un produit</div>'; return; }
  const payload = {
    boutique_id: CURRENT.id, type: document.getElementById('promotionType').value, value, product_ids,
    starts_at: document.getElementById('promotionStarts').value || null,
    expires_at: document.getElementById('promotionExpires').value || null,
  };
  const action = id ? '/marketing?action=promotion_update' : '/marketing?action=promotion_create';
  if (id) payload.id = id;
  post(action, payload).then(({data}) => {
    if (!data.success) { document.getElementById('promotionMsg').innerHTML = '<div class="msg error">'+escapeHtml(data.message)+'</div>'; return; }
    closeModal(); route();
  });
}
function togglePromotion(id, active) { post('/marketing?action=promotion_update', {boutique_id:CURRENT.id, id, active}).then(()=>route()); }
function deletePromotion(id) { if(!confirm('Supprimer cette promotion ?')) return; post('/marketing?action=promotion_delete', {boutique_id:CURRENT.id, id}).then(()=>route()); }
function moderateReview(id, status) { post('/marketing?action=review_moderate', {boutique_id:CURRENT.id, id, status}).then(()=>route()); }
function deleteReview(id) { if(!confirm('Supprimer cet avis ?')) return; post('/marketing?action=review_delete', {boutique_id:CURRENT.id, id}).then(()=>route());
}

function handleLogoFile(input) {

  resizeImageToDataUrl(file, 400, dataUrl => {
    document.getElementById('setLogo').value = dataUrl;
    const preview = document.getElementById('setLogoPreview');
    preview.src = dataUrl; preview.style.display = 'block';
  });
}

// passait, le message apparaissant hors de vue plus haut).
function saveSettings(targetMsgId) {
  const msgEl = document.getElementById(targetMsgId || 'settingsMsg');
  post('/boutiques?action=update', {
    id:CURRENT.id, name:document.getElementById('setName').value.trim(),
    description:document.getElementById('setDescription').value.trim(),
    logo_url:document.getElementById('setLogo').value.trim(),

    const rows = data.data || [];
    document.getElementById('content').innerHTML = `
      <div class="row-between"><div><h2 class="page-title">Équipe</h2><div class="page-sub">Invitez des collègues à gérer la boutique avec vous. Chacun garde son propre compte.</div></div>
        <button class="btn btn-primary" onclick="openInviteForm()">+ Inviter un membre</button></div>
      <div class="card"><table><thead><tr><th>Nom</th><th>Email</th><th>Rôle</th><th>Statut</th><th></th></tr></thead><tbody>
        ${rows.map(m=>`<tr><td>${escapeHtml(m.full_name||'—')}</td><td>${escapeHtml(m.email)}</td><td>${ROLE_LABELS[m.role]||m.role}</td>
          <td>${m.status==='active'?'<span class="pill pill-delivered">Actif</span>':'<span class="pill pill-pending">En attente</span>'}</td>
          <td>${m.id?'<button class="btn btn-ghost btn-sm" onclick="removeTeamMember(\''+m.id+'\')">Retirer</button>':''}</td></tr>`).join('')}
      </tbody></table></div>
    `;
  });
}
function openInviteForm() {
  api('/deliveries?action=persons&boutique_id='+CURRENT.id).then(({data}) => {
    const persons = (data.data || []).filter(p=>p.active);
    openModal(`<h2>Inviter un membre</h2>
      <div id="inviteMsg"></div>
      <div class="field"><label>Email</label><input id="inviteEmail" type="email" placeholder="collegue@exemple.com"></div>
      <div class="field"><label>Rôle</label><select id="inviteRole" onchange="toggleInviteDeliveryPerson()">
        <option value="admin">Admin — accès complet à toute la boutique</option>
        <option value="manager" selected>Manager — tout sauf équipe et paramètres</option>
        <option value="livreur">Livreur — voit les livraisons</option>
        <option value="closeuse">Closeuse — commandes, clients, stock</option>
        <option value="comptable">Comptable — finances et analytique</option>
      </select></div>
      <div class="field" id="inviteDeliveryPersonField" style="display:none">
        <label>Fiche livreur associée (pour ne voir que ses livraisons)</label>
        <select id="inviteDeliveryPerson"><option value="">— aucune (verra ses livraisons dès qu'un admin le liera plus tard)</option>
          ${persons.map(p=>'<option value="'+p.id+'">'+escapeHtml(p.name)+'</option>').join('')}
        </select>
      </div>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="submitInvite()">Envoyer l'invitation</button></div>`);
  });
}
function toggleInviteDeliveryPerson() {
  document.getElementById('inviteDeliveryPersonField').style.display = document.getElementById('inviteRole').value === 'livreur' ? 'block' : 'none';
}
function submitInvite() {
  const email = document.getElementById('inviteEmail').value.trim();
  if (!email) return;
  const role = document.getElementById('inviteRole').value;
  const dpField = document.getElementById('inviteDeliveryPerson');
  post('/team?action=invite', {boutique_id:CURRENT.id, email, role, delivery_person_id: dpField ? dpField.value : '',
    page_url: window.location.origin + window.location.pathname.replace(/dashboard\/.*/, '')}).then(({data}) => {
    if (!data.success) { document.getElementById('inviteMsg').innerHTML = '<div class="msg error">'+data.message+'</div>'; return; }
    if (data.data && data.data.invite_link_dev_only) alert('Mode développement — lien direct : '+data.data.invite_link_dev_only);
    closeModal(); route();
  });
}
function removeTeamMember(id) {
  if (!confirm('Retirer ce membre de la boutique ?')) return;
  post('/team?action=remove', {boutique_id:CURRENT.id, id}).then(()=>route());
}

// ============================================================
// Mon profil (niveau compte, pas boutique)
// ============================================================
function renderProfile() {
  document.getElementById('content').innerHTML = '<div class="empty">Chargement…</div>';
  api('/auth?action=me').then(({data}) => {
    if (!data.success) { document.getElementById('content').innerHTML = '<div class="card">'+escapeHtml(data.message)+'</div>'; return; }
    const u = data.data;
    document.getElementById('content').innerHTML = `
      <h2 class="page-title">Mon profil</h2>
      <div class="card">
        <div id="profileMsg"></div>
        <div class="field"><label>Nom complet</label><input id="profName" value="${escapeHtml(u.full_name||'')}"></div>
        <div class="field"><label>Email</label><input value="${escapeHtml(u.email)}" readonly></div>
        <div class="field"><label>Nouveau mot de passe (laisser vide pour ne pas changer)</label>
          <div class="password-wrap"><input id="profPassword" type="password" placeholder="6 caractères minimum">
            <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('profPassword', this)">🙈</button></div>
        </div>
        <button class="btn btn-primary" onclick="saveProfile()">Enregistrer</button>
      </div>
    `;
  });
}
function saveProfile() {
  const payload = {full_name: document.getElementById('profName').value.trim()};
  const pwd = document.getElementById('profPassword').value;
  if (pwd) payload.new_password = pwd;
  post('/auth?action=profile_update', payload).then(({data}) => {
    if (!data.success) { document.getElementById('profileMsg').innerHTML = '<div class="msg error">'+data.message+'</div>'; return; }
    document.getElementById('profileMsg').innerHTML = '<div class="msg success">Profil mis à jour</div>';
    document.getElementById('profPassword').value = '';
    USER.full_name = payload.full_name;
    localStorage.setItem('myboutik_user', JSON.stringify(USER));
  });
}

// ============================================================
// Abonnement
// ============================================================
function renderBilling() {
  document.getElementById('content').innerHTML = '<div class="empty">Chargement…</div>';
  api('/billing?action=plans').then(({data}) => {
    if (!data.success) { document.getElementById('content').innerHTML = '<div class="card">'+escapeHtml(data.message)+'</div>'; return; }
    const B = data.data;
    const plans = Object.entries(B.plans);
    const daysLeft = B.plan_valid_until ? Math.ceil((new Date(B.plan_valid_until) - new Date()) / 86400000) : null;
    document.getElementById('content').innerHTML = `
      <h2 class="page-title">Abonnement</h2>
      <div class="page-sub">Plan actuel : <strong>${B.plans[B.current_plan]?.name || B.current_plan}</strong> ${B.plan_status==='active'?'<span class="pill pill-delivered">Actif</span>':'<span class="pill pill-pending">En attente</span>'}
        ${daysLeft !== null ? (daysLeft >= 0 ? ' — accès valide jusqu\'au '+fmtDate(B.plan_valid_until)+' ('+daysLeft+' jour(s) restant(s))' : ' — <strong style="color:#b91c1c">accès expiré le '+fmtDate(B.plan_valid_until)+'</strong>') : ''}
      </div>
      ${daysLeft !== null && daysLeft < 0 ? '<div class="card" style="background:#fef2f2;border-color:#fecaca">⚠️ Votre accès aux boutiques est bloqué tant que vous ne renouvelez pas votre abonnement ci-dessous.</div>' : ''}
      ${daysLeft !== null && daysLeft >= 0 && daysLeft <= 5 ? '<div class="card" style="background:var(--amber-bg);border-color:#fde68a">⏳ Votre abonnement expire dans '+daysLeft+' jour(s) — pensez à renouveler pour ne pas perdre l\'accès à vos boutiques.</div>' : ''}
      ${B.pending_request ? `<div class="card" style="background:var(--amber-bg);border-color:#fde68a">Demande en cours pour le plan <strong>${B.plans[B.pending_request.plan]?.name}</strong> — ${B.payment_instructions}</div>` : ''}
      <div class="kpi-grid">
        ${plans.map(([key,p]) => `
          <div class="card" style="${key===B.current_plan?'border-color:var(--blue)':''}">
            <h3>${p.name}</h3>
            ${key==='starter' ? '<div style="color:#16a34a;font-weight:700;font-size:13px;margin-top:4px">🎁 1er mois gratuit</div>' : ''}
            <div style="font-size:22px;font-weight:800;margin:8px 0">${fmtMoney(p.price)}<span class="muted" style="font-size:13px;font-weight:400">/mois</span></div>
            <div class="muted" style="margin-bottom:14px">${p.boutique_limit} boutique(s)</div>
            ${key===B.current_plan ? '<button class="btn btn-ghost btn-block" disabled>Plan actuel</button>' : '<button class="btn btn-primary btn-block" onclick="subscribeToPlan(\''+key+'\')">Choisir</button>'}
          </div>`).join('')}
      </div>
    `;
  });
}
function subscribeToPlan(plan) {
  post('/billing?action=subscribe', {plan}).then(({data}) => {
    alert(data.message);
    if (data.success) renderBilling();
  });
}

// ============================================================
// Affiliation (niveau compte)
// ============================================================
function renderAffiliate() {
  document.getElementById('content').innerHTML = '<div class="empty">Chargement…</div>';
  api('/billing?action=affiliate_info').then(({data}) => {
    if (!data.success) { document.getElementById('content').innerHTML = '<div class="card">'+escapeHtml(data.message)+'</div>'; return; }
    const A = data.data;
    const link = window.location.origin + window.location.pathname.replace(/dashboard\/.*/, '') + '?ref=' + A.referral_code;
    document.getElementById('content').innerHTML = `
      <h2 class="page-title">Affiliation</h2>
      <div class="page-sub">Recommandez MYBOUTIK et gagnez 10% de chaque abonnement payé par vos filleuls.</div>
      <div class="card">
        <h3>Votre lien d'affiliation</h3>
        <div class="page-sub">Gagnez 10% de chaque paiement d'abonnement de vos filleuls.</div>
        <div class="field-row">
          <input id="refLinkInput" value="${link}" readonly>
          <button class="btn btn-primary" onclick="copyRefLink()">Copier</button>
        </div>
      </div>
      <div class="kpi-grid">
        <div class="kpi"><div class="lbl">Clics sur le lien</div><div class="val">${A.clicks}</div></div>
        <div class="kpi"><div class="lbl">Inscriptions</div><div class="val">${A.signups}</div></div>
        <div class="kpi"><div class="lbl">Abonnés payants</div><div class="val">${A.paying_referrals}</div></div>
        <div class="kpi"><div class="lbl">Total gagné</div><div class="val">${fmtMoney(A.total_earned)}</div></div>
      </div>
      <div class="card">
        <h3>Mes commissions</h3>
        <div class="kpi-grid">
          <div class="kpi"><div class="lbl">En attente de validation</div><div class="val">${fmtMoney(A.pending_validation)}</div></div>
          <div class="kpi" style="background:var(--success-bg,#ecfdf5)"><div class="lbl">Disponible au retrait</div><div class="val">${fmtMoney(A.available)}</div></div>
          <div class="kpi"><div class="lbl">Déjà payé</div><div class="val">${fmtMoney(A.paid)}</div></div>
        </div>
        <div class="muted" style="margin:10px 0">Une commission devient disponible après ${A.validation_days} jours de validation. Retrait minimum : ${fmtMoney(A.min_payout)}.</div>
        <div class="field-row">
          <select id="payoutMethod"><option value="wave">Wave</option><option value="orange_money">Orange Money</option><option value="mtn_momo">MTN MoMo</option><option value="moov_money">Moov Money</option></select>
          <input id="payoutPhone" placeholder="+225 00 00 00 00 00">
          <button class="btn btn-primary" ${A.available<A.min_payout?'disabled':''} onclick="requestPayout()">Demander le retrait</button>
        </div>
      </div>
      <div class="card">
        <h3>Mes filleuls</h3>
        ${A.referred_users.length ? `<table><thead><tr><th>Email</th><th>Statut</th><th>Inscrit le</th></tr></thead><tbody>
          ${A.referred_users.map(r=>`<tr><td>${escapeHtml(r.email)}</td><td>${r.plan_status==='active'?'<span class="pill pill-delivered">Payant</span>':'<span class="pill pill-pending">Inscrit</span>'}</td><td>${fmtDate(r.created_at)}</td></tr>`).join('')}
          </tbody></table>` : '<div class="empty">Personne pour l\'instant — partagez votre lien pour commencer à gagner.</div>'}
      </div>
    `;
  });
}
function copyRefLink() { copyInput('refLinkInput'); }
// L'icone reflete l'etat ACTUEL du champ : 🙈 = actuellement masque
// (cliquer pour reveler), 👁️ = actuellement visible (cliquer pour masquer).
function togglePasswordVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  const reveal = input.type === 'password';
  input.type = reveal ? 'text' : 'password';
  btn.textContent = reveal ? '👁️' : '🙈';
}
function copyInput(id) {
  const input = document.getElementById(id);
  input.select();
  navigator.clipboard && navigator.clipboard.writeText(input.value);
}
function storeLink() {
  return window.location.origin + window.location.pathname.replace(/dashboard\/.*/, '') + 'store/index.html?b=' + encodeURIComponent(CURRENT.slug);
}
// Chaque reseau a sa propre URL de partage "toute prete" (le fameux
// "intent" web) - pas d'API a appeler, juste ouvrir ce lien suffit a
// pre-remplir le message avec le lien de la boutique. Instagram n'a pas
// d'equivalent web, d'ou l'absence de bouton pour ce reseau.
function shareStoreOn(network) {
  const link = storeLink();
  const text = 'Découvrez ' + CURRENT.name + ' !';
  const urls = {
    whatsapp: 'https://wa.me/?text=' + encodeURIComponent(text + ' ' + link),
    facebook: 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(link),
    telegram: 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(text),
    x: 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(link),
  };
  if (urls[network]) window.open(urls[network], '_blank');
}
function requestPayout() {
  const phone = document.getElementById('payoutPhone').value.trim();
  if (!phone) { alert('Numéro Mobile Money requis'); return; }
  post('/billing?action=affiliate_request_payout', {method:document.getElementById('payoutMethod').value, phone}).then(({data}) => {
    alert(data.message);
    if (data.success) renderAffiliate();
  });
}

// ============================================================
// Intégrations (Google Sheets)
// ============================================================
function renderIntegrations(bt) {
  document.getElementById('content').innerHTML = '<div class="empty">Chargement…</div>';
  api('/integrations?action=sheet_get&boutique_id='+bt.id).then(({data}) => {
    if (!data.success) { document.getElementById('content').innerHTML = '<div class="card">'+escapeHtml(data.message)+'</div>'; return; }
    const S = data.data;
    document.getElementById('content').innerHTML = `
      <h2 class="page-title">Intégrations</h2>
      <div class="page-sub">Reliez une source de commandes extérieure. Chaque ligne devient une vraie commande MYBOUTIK.</div>
      <div class="card">
        <h3>Google Sheets</h3>
        <div class="page-sub">Publiez votre feuille en CSV (Fichier → Partager → Publier sur le web → CSV) puis collez le lien ici.</div>
        <div id="sheetMsg"></div>
        <div class="field"><label>Lien de votre Google Sheet (CSV)</label><input id="sheetUrl" value="${escapeHtml(S.sheet_url||'')}" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv"></div>
        <label style="display:flex;align-items:center;gap:8px;margin-bottom:14px"><input type="checkbox" id="sheetEnabled" ${S.sheet_sync_enabled?'checked':''}> Activer cette intégration</label>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" onclick="saveSheetSettings()">Enregistrer</button>
          <button class="btn btn-ghost" onclick="importSheetNow()">Importer maintenant</button>
        </div>
      </div>
      <div class="card">
        <h3>Colonnes attendues</h3>
        <table><thead><tr><th>Colonne</th><th>Obligatoire</th><th>Exemple</th></tr></thead><tbody>
          <tr><td>id_commande</td><td>Oui</td><td>CMD-1042</td></tr>
          <tr><td>client</td><td>Oui</td><td>Awa Diallo</td></tr>
          <tr><td>telephone</td><td>Oui</td><td>+225 07 00 00 00</td></tr>
          <tr><td>sku</td><td>Oui</td><td>TS-BLEU-M (doit exister dans vos produits)</td></tr>
          <tr><td>quantite</td><td>Non</td><td>2 (vide = 1)</td></tr>
          <tr><td>prix_unitaire</td><td>Non</td><td>14900 (vide = prix catalogue)</td></tr>
          <tr><td>frais_livraison</td><td>Non</td><td>2000 (une seule ligne par commande)</td></tr>
          <tr><td>ville / quartier / adresse</td><td>Non</td><td>Abidjan / Cocody / Rue des Jardins</td></tr>
        </tbody></table>
        <div class="muted" style="margin-top:10px">Une commande avec plusieurs produits ? Mettez une ligne par produit avec le même id_commande.</div>
      </div>
      <div class="card" id="sheetResultCard" style="display:none"></div>
    `;
  });
}
function saveSheetSettings() {
  post('/integrations?action=sheet_save', {boutique_id:CURRENT.id, sheet_url:document.getElementById('sheetUrl').value.trim(), sheet_sync_enabled:document.getElementById('sheetEnabled').checked}).then(({data}) => {
    document.getElementById('sheetMsg').innerHTML = '<div class="msg '+(data.success?'success':'error')+'">'+data.message+'</div>';
  });
}
function importSheetNow() {
  saveSheetSettings();
  post('/integrations?action=sheet_import', {boutique_id:CURRENT.id}).then(({data}) => {
    const card = document.getElementById('sheetResultCard');
    card.style.display = 'block';
    if (!data.success) { card.innerHTML = '<div class="msg error">'+data.message+'</div>'; return; }
    card.innerHTML = '<h3>Résultat de l\'import</h3><div class="msg success">'+data.message+'</div>' +
      (data.data.skipped.length ? '<div class="muted">Lignes ignorées :<br>'+data.data.skipped.map(escapeHtml).join('<br>')+'</div>' : '');
  });
}
</script>
</body>
