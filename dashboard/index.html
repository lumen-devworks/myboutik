<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYBOUTIK — Tableau de bord</title>
<style>
  :root{
    --blue:#ea580c; --blue-dark:#c2410c; --ink:#0f172a; --gray:#64748b;
    --border:#e2e8f0; --bg:#f8fafc; --green:#16a34a; --green-bg:#ecfdf5;
    --red:#dc2626; --red-bg:#fef2f2; --amber:#d97706; --amber-bg:#fffbeb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  html{overflow-x:hidden;max-width:100%}
  body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;max-width:100%}
  a{color:inherit;text-decoration:none}
  button,select,input,textarea{font-family:inherit}
  #app{display:flex;height:100vh}

  /* Sidebar : hauteur fixe (100vh), defile independamment du contenu -
     seule la liste de liens (nav.side-nav) scrolle si elle deborde, le
     logo/le selecteur de boutique en haut restent toujours visibles. */
  #sidebar{width:230px;height:100vh;background:#fff;border-right:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column}
  .side-top{padding:16px;border-bottom:1px solid var(--border)}
  .side-top .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin-bottom:10px}
  .side-top .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#fb923c,#c2410c);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:10px;letter-spacing:-1px}
  select#boutiqueSwitch{width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);font-size:13px}
  .side-back{display:block;padding:10px 16px;font-size:13px;color:var(--gray);border-bottom:1px solid var(--border)}
  .side-back:hover{background:var(--bg)}
  nav.side-nav{flex:1;overflow-y:auto;padding:8px}
  .side-group{font-size:11px;text-transform:uppercase;color:var(--gray);font-weight:700;padding:14px 12px 4px}
  .side-link{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;font-size:14px;color:var(--ink);cursor:pointer}
  .side-link:hover{background:var(--bg)}
  .side-link.active{background:#fff1e6;color:var(--blue);font-weight:600}
  .side-sub{padding-left:26px}

  /* Topbar + content : le topbar reste fixe (flex-shrink:0, ne scrolle
     jamais), seul #content defile - meme principe que la barre laterale. */
  #main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden}
  #topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:hidden}
  #topbar h1{font-size:16px}
  .top-actions{display:flex;gap:8px;align-items:center}
  /* overflow-x:hidden explicite (pas juste hidden sur html/body) : sans ca,
     overflow-y:auto donne implicitement overflow-x:auto d'apres la
     specification CSS, ce qui laissait #content s'elargir/se faire
     "panner" horizontalement des qu'un enfant (bouton non enveloppant,
     valeur trop longue...) depassait sa largeur - meme derriere un
     overflow:hidden sur body. Ici, un tel contenu est simplement rogne au
     lieu de pousser toute la page vers la droite. */
  #content{padding:24px;flex:1;max-width:1200px;width:100%;margin:0 auto;overflow-y:auto;overflow-x:hidden}

  .btn{border:none;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{background:var(--blue-dark)}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--border)}
  .btn-ghost:hover{background:var(--bg)}
  .btn-danger{background:var(--red-bg);color:var(--red)}
  .btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}

  h2.page-title{font-size:22px;margin-bottom:4px}
  .page-sub{color:var(--gray);font-size:14px;margin-bottom:20px}
  /* Cadre "premium" de l'accueil - meme technique de bordure en degrade
     que le panneau admin (double background : fond blanc + degrade,
     recadres l'un sur padding-box et l'autre sur border-box) pour un
     effet plus soigne qu'une simple bordure plate. */
  .home-hero{
    background:#fff;border:2px solid transparent;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#fb923c 0%,var(--blue) 45%,var(--blue-dark) 100%);
    background-origin:border-box;background-clip:padding-box,border-box;
    border-radius:18px;padding:26px;margin-bottom:20px;
    box-shadow:0 16px 36px -18px rgba(194,65,12,.35);
    text-align:center;
  }
  .home-hero .page-title{margin-bottom:8px;text-transform:uppercase;letter-spacing:.02em}
  .home-boutique-name{color:var(--blue)}
  .row-between{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
  /* min-width:0 : sans ca, une grille a colonnes egales (1fr) grandit quand
     meme au-dela de sa largeur disponible si le contenu d'une case (ex: un
     montant "357 400 XOF" qui ne se coupe pas) est plus large que sa part -
     exactement ce qui a pousse toute la page a deborder horizontalement. */
  .kpi{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;min-width:0}
  .kpi .lbl{font-size:13px;color:var(--gray);display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .kpi .val{font-size:24px;font-weight:800;overflow-wrap:break-word}
  /* Vue d'ensemble multi-boutiques : toujours 2 cases par ligne (meme sur
     telephone, ou .kpi-grid generique repasse a 1 colonne), avec le
     revenu total mis en evidence par un fond degrade plutot qu'une
     simple carte blanche comme les 3 autres. */
  .overview-kpi-grid{grid-template-columns:repeat(2,1fr)}
  .kpi-highlight{
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#fb923c 0%,var(--blue) 45%,var(--blue-dark) 100%);
    background-origin:border-box;background-clip:padding-box,border-box;
    border:2px solid transparent;
    box-shadow:0 10px 24px -12px rgba(194,65,12,.4);
  }
  .kpi-highlight .val{color:var(--blue)}

  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px}
  .card h3{font-size:15px;margin-bottom:14px}
  .empty{text-align:center;color:var(--gray);font-size:14px;padding:36px 12px}
  .empty .big{font-size:30px;margin-bottom:8px}

  table{width:100%;border-collapse:collapse;font-size:14px}
  table th{text-align:left;color:var(--gray);font-weight:600;font-size:12px;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--border)}
  table td{padding:10px 10px;border-bottom:1px solid var(--border)}
  table tr:last-child td{border-bottom:none}

  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .pill-pending{background:var(--amber-bg);color:var(--amber)}
  .pill-processing,.pill-assigned,.pill-shipped,.pill-in_delivery{background:#eff6ff;color:#2563eb}
  .pill-delivered{background:var(--green-bg);color:var(--green)}
  .pill-refused,.pill-cancelled{background:var(--red-bg);color:var(--red)}
  .pill-to_assign{background:#f1f5f9;color:var(--gray)}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;font-size:14px}
  .password-wrap{position:relative}
  .password-wrap input{padding-right:40px}
  .pw-toggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;padding:5px;line-height:1}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .tab{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:var(--gray)}
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .overlay.open{display:flex}
  #toastContainer{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:90vw}
  .toast{pointer-events:auto;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 6px 18px rgba(15,23,42,.15);max-width:440px;text-align:center;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast-success{background:#dcfce7;color:#166534;border:1px solid #86efac}
  .toast-error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
  .toast-info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
  .modal{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:28px;max-height:88vh;overflow-y:auto}
  .modal h2{font-size:18px;margin-bottom:16px}
  .modal-actions{display:flex;gap:10px;margin-top:8px}
  .msg{font-size:13px;border-radius:10px;padding:9px 11px;margin-bottom:12px}
  .msg.error{background:var(--red-bg);color:var(--red)}
  .msg.success{background:var(--green-bg);color:#15803d}

  .progress-bar{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:14px 0}
  .progress-bar .fill{height:100%;background:linear-gradient(90deg,#fb923c,#c2410c)}
  .boutique-card{border:1px solid var(--border);border-radius:14px;padding:18px;background:#fff;display:flex;flex-direction:column;gap:10px}
  .grades-list .grade-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
  .grades-list .grade-row:last-child{border-bottom:none}
  .muted{color:var(--gray);font-size:13px}

  #menuToggle{display:none;font-size:18px;padding:6px 10px}
  #sidebarBackdrop{display:none}
  .lang-switch{display:flex;gap:3px;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:3px}
  .lang-switch button{background:none;color:var(--gray);border:none;padding:6px 10px;font-size:11px;font-weight:700;border-radius:999px;cursor:pointer}
  .lang-switch button.active{background:var(--blue);color:#fff}

  /* Telephones/petites tablettes : la barre laterale devient un tiroir qui
     se superpose au contenu au lieu de lui voler en permanence 230px de
     large - bascule via le bouton ☰ du haut, ou en touchant le fond noir. */
  @media (max-width: 860px) {
    #menuToggle{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
    #sidebar{position:fixed;left:0;top:0;z-index:45;transform:translateX(-100%);transition:transform .2s ease;box-shadow:2px 0 12px rgba(0,0,0,.15)}
    #sidebar.open{transform:translateX(0)}
    #sidebarBackdrop.open{display:block;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40}
    #topbar{padding:10px 14px;flex-wrap:wrap;row-gap:6px;height:auto}
    /* Chaque groupe (titre, email, actions) reste sur sa PROPRE ligne
       complete (width:100%) plutot que de partager une ligne en flex-shrink
       - cette derniere approche s'est montree fragile (l'un des elements
       finissait ecrase a une largeur nulle selon la longueur du contenu).
       Ici chacun est toujours visible, quelle que soit la longueur du nom
       de boutique ou de l'email. */
    #topbar h1{font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #userEmail{width:100%;margin-left:0;font-size:11px}
    .top-actions{width:100%;justify-content:flex-end}
    #content{padding:14px}
    .field-row{grid-template-columns:1fr}
    .kpi-grid{grid-template-columns:1fr 1fr}
    /* Les cartes d'abonnement (Starter/Pro/Premium) restent 1 par ligne -
       leur contenu (prix, "1er mois gratuit") est trop large pour tenir a
       cote d'une autre carte, contrairement aux petites tuiles de stats. */
    .plans-grid{grid-template-columns:1fr}
    /* Les tableaux larges (finances, commandes...) defilent horizontalement
       au lieu de deborder de l'ecran ou d'ecraser les colonnes. */
    .card table{display:block;overflow-x:auto;white-space:nowrap}
  }
  @media (max-width: 480px) {
    .kpi-grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .kpi{padding:14px}
    .kpi .val{font-size:20px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebarBackdrop" onclick="toggleSidebar()"></div>
  <div id="sidebar">
    <div class="side-top">
      <div class="logo"><div class="mark">MB</div> MYBOUTIK</div>
      <select id="boutiqueSwitch" onchange="switchBoutique(this.value)"></select>
    </div>
    <a class="side-back" href="#/boutiques" onclick="closeSidebar()" id="sideBackAll">← Toutes mes boutiques</a>
    <a class="side-back" href="../directory/index.html" id="sideDirectoryLink">🏬 Annuaire des boutiques</a>
    <a class="side-back" href="../guide.html" target="_blank" id="sideGuideLink">📖 Guide d'utilisation</a>
    <nav class="side-nav" id="sideNav"></nav>
  </div>
  <div id="main">
    <div id="topbar">
      <div id="topbarLeft" style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
        <button id="menuToggle" class="btn btn-ghost btn-sm" onclick="toggleSidebar()" aria-label="Menu">☰</button>
        <h1 id="topTitle">Tableau de bord</h1>
      </div>
      <span class="muted" id="userEmail" style="margin-left:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
      <div class="top-actions">
        <div class="lang-switch"><button type="button" id="langFr" onclick="setLang('fr')">FR</button><button type="button" id="langEn" onclick="setLang('en')">EN</button></div>
        <button class="btn btn-ghost btn-sm" onclick="logout()" id="logoutBtn">Se déconnecter</button>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div class="overlay" id="modalOverlay"><div class="modal" id="modalBody"></div></div>
<div class="overlay" id="confirmOverlay" style="z-index:200"><div class="modal" id="confirmModalBody" style="max-width:400px"></div></div>
<div id="toastContainer"></div>

<script src="../config.js"></script>
<script>
const API_URL = window.MYBOUTIK_API_URL || 'http://localhost:8000';
const TOKEN = localStorage.getItem('myboutik_token');
if (!TOKEN) window.location.href = '../index.html';
const USER = JSON.parse(localStorage.getItem('myboutik_user') || '{}');

let BOUTIQUES = [];
let CURRENT = null; // boutique courante {id,slug,name,...}

function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+TOKEN}, opts.headers||{});
  headers['X-Lang'] = LANG;
  return fetch(API_URL+path, Object.assign({}, opts, {headers}))
    .then(r => r.json().then(data => ({status:r.status, data})).catch(()=>({status:r.status,data:{success:false,message:t('invalid_response')}})))
    .catch(() => ({status:0, data:{success:false, message:t('server_unreachable')}}))
    .then(res => {
      if (res.status === 401) { logout(); }
      return res;
    });
}
function post(path, body) { return api(path, {method:'POST', body:JSON.stringify(body||{})}); }
// Les exports CSV renvoient un fichier (pas du JSON) et exigent quand meme le
// header Authorization - impossible via un simple <a href>, donc on
// telecharge en fetch() puis on declenche l'enregistrement via un <a> cache
// pointant sur un blob: local.
function downloadCsv(path, filename) {
  fetch(API_URL+path, {headers:{'Authorization':'Bearer '+TOKEN}}).then(r => {
    if (!r.ok) throw new Error('export impossible');
    return r.blob();
  }).then(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }).catch(() => showToast(t('export_impossible'), 'error'));
}
function logout() { localStorage.removeItem('myboutik_token'); localStorage.removeItem('myboutik_user'); window.location.href = '../index.html'; }

function fmtMoney(n, currency) { return Math.round(n||0).toLocaleString('fr-FR') + ' ' + (currency||'FCFA'); }
function fmtDate(iso) { if(!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// TRADUCTION (FR/EN) - textes fixes de l'interface. Les messages qui
// viennent du serveur sont deja traduits cote backend via l'entete
// X-Lang envoye par api() (voir t()/EN_DICT dans index.php).
// ============================================================

function t(key) { return (I18N[LANG] && I18N[LANG][key]) ?? I18N.fr[key] ?? key; }
function tf(key, vars) {
  let s = t(key);
  Object.keys(vars || {}).forEach(k => { s = s.split('{'+k+'}').join(vars[k]); });
  return s;
}
function setLang(lang) {
  LANG = lang === 'en' ? 'en' : 'fr';
  localStorage.setItem('myboutik_dash_lang', LANG);
  document.getElementById('langFr').classList.toggle('active', LANG === 'fr');
  document.getElementById('langEn').classList.toggle('active', LANG === 'en');
  document.getElementById('logoutBtn').textContent = t('btn_logout');
  document.getElementById('sideBackAll').textContent = t('side_back_all_boutiques');
  document.getElementById('sideDirectoryLink').textContent = t('side_directory');
  document.getElementById('sideGuideLink').textContent = t('side_guide');
  route();
}

// Remplace confirm() natif (position/style non maitrisables selon le
// navigateur, parfois pres de la barre d'adresse) par une boite de
// dialogue centree sur la page. Utilise sa PROPRE surcouche (confirmOverlay,
// empilee au-dessus de modalOverlay) plutot que openModal()/closeModal() -
// beaucoup de suppressions se declenchent depuis un modal deja ouvert
// (ex: supprimer une categorie depuis "Gerer les categories"), et reutiliser
// le meme modal aurait efface ce modal-la au lieu de simplement le suspendre
// pendant la confirmation. Retourne une Promise<boolean> (true = confirme).
function customConfirm(message, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    document.getElementById('confirmModalBody').innerHTML = `
      <p style="font-size:15px;line-height:1.5;white-space:pre-line;margin-bottom:20px">${escapeHtml(message)}</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="confirmCancelBtn">${t('btn_cancel')}</button>
        <button type="button" class="btn ${opts.danger ? 'btn-danger' : 'btn-primary'}" id="confirmOkBtn">${t('confirm_ok_btn')}</button>
      </div>
    `;
    document.getElementById('confirmOverlay').classList.add('open');
    const finish = (result) => { document.getElementById('confirmOverlay').classList.remove('open'); resolve(result); };
    document.getElementById('confirmCancelBtn').onclick = () => finish(false);
    document.getElementById('confirmOkBtn').onclick = () => finish(true);
  });
}
// Remplace window.alert() par une notification stylee coherente avec le
// reste de l'appli - type deduit du contenu si non precise (les messages
// d'erreur commencent generalement par une lettre suivant un pattern
// different, mais le plus fiable reste de le passer explicitement a
// l'appel ; 'info' par defaut pour ne rien casser aux appels existants).
function showToast(message, type) {
  type = type || 'info';
  const container = document.getElementById('toastContainer');
  if (!container) { window.alert(message); return; }
  const el = document.createElement('div');
  el.className = 'toast toast-'+type;
  el.textContent = message;
  container.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 250);
  }, 4000);
}

function loadBoutiques() {
  return api('/boutiques?action=list').then(({data}) => {
    if (!data.success) return [];
    BOUTIQUES = data.data;
    const sel = document.getElementById('boutiqueSwitch');
    sel.innerHTML = BOUTIQUES.map(b => '<option value="'+b.slug+'">'+escapeHtml(b.name)+'</option>').join('')
      || '<option value="">'+t('no_boutique_option')+'</option>';
    return BOUTIQUES;
  });
}

function route() {
  const hash = window.location.hash.replace(/^#\/?/, '');
  const parts = hash.split('/').filter(Boolean);
  loadBoutiques().then(() => {
    if (parts[0] !== undefined && parts[0] !== 'boutiques' && BOUTIQUES.some(b => b.slug === parts[0])) {
      CURRENT = BOUTIQUES.find(b => b.slug === parts[0]);
      document.getElementById('boutiqueSwitch').value = CURRENT.slug;
      renderSidebar(CURRENT, parts.slice(1).join('/') || 'home');
      renderSection(CURRENT, parts.slice(1).join('/') || 'home');
    } else {
      CURRENT = null;
      document.getElementById('sideNav').innerHTML = '';
      document.getElementById('topTitle').textContent = t('my_boutiques_title');
      renderBoutiquesList();
    }
  });
}
window.addEventListener('hashchange', route);

// Module dont depend chaque page (voir ROLE_MODULE_ACCESS cote backend,
// meme repartition) - '*' = toujours visible, 'admin' = proprietaire/admin
// de la boutique seulement, 'account' = toujours visible (concerne le
// compte connecte, pas la boutique affichee).
const NAV_MODULE = {
  home:'*', grade:'*',
  orders:'orders', 'orders/delivery':'deliveries', 'orders/abandoned':'orders',
  customers:'customers', contacts:'contacts',
  'finance/overview':'finance', 'finance/accounts':'finance', 'finance/delivery-fees':'finance', 'finance/detail':'finance', 'finance/ads':'finance',
  products:'products', 'products/stock':'products', 'products/suppliers':'products', 'products/supplier-orders':'products',
  'analytics/reports':'analytics', 'analytics/live':'analytics', 'analytics/history':'admin',
  marketing:'marketing',
  settings:'admin', team:'admin', integrations:'admin',
  profile:'account', billing:'account', affiliate:'account',
};
const ROLE_MODULE_ACCESS_CLIENT = {
  manager: ['orders','deliveries','customers','contacts','finance','products','analytics','marketing'],
  closeuse: ['orders','customers','products'],
  comptable: ['finance','analytics'],
  livreur: ['deliveries'],
};
function navItemVisible(role, key) {
  const need = NAV_MODULE[key];
  if (need === '*' || need === 'account') return true;
  if (role === 'owner' || role === 'admin') return true;
  if (need === 'admin') return false;
  return (ROLE_MODULE_ACCESS_CLIENT[role] || []).includes(need);
}
function renderSidebar(bt, current) {
  const role = bt.my_role || 'owner';
  document.getElementById('sideNav').innerHTML = NAV_FN().map(g => {
    const items = g.items.filter(([key]) => navItemVisible(role, key));
    if (!items.length) return '';
    return (g.group ? '<div class="side-group">'+g.group+'</div>' : '') +
      items.map(([key,icon,label]) =>
        '<a class="side-link'+(current===key?' active':'')+'" href="#/'+bt.slug+'/'+key+'" onclick="closeSidebar()">'+icon+' '+label+'</a>'

  }).join('');
}

// Agrege les stats deja chargees par boutique (voir loadBoutiques()) - pas

// Les montants sont regroupes par devise plutot que sommes en vrac : deux
// boutiques en XOF et FCFA-ailleurs ne doivent jamais se retrouver
// additionnees dans un seul total trompeur.
function renderMultiBoutiqueSummary() {
  if (BOUTIQUES.length < 2) return '';
  const totalCommandes = BOUTIQUES.reduce((s,b)=>s+Number(b.stats.commandes),0);
  const totalEnAttente = BOUTIQUES.reduce((s,b)=>s+Number(b.stats.en_attente),0);
  const byCurrency = {};
  BOUTIQUES.forEach(b => { byCurrency[b.currency] = (byCurrency[b.currency]||0) + Number(b.stats.ca_encaisse); });
  const totalsHtml = Object.entries(byCurrency).map(([cur,amt]) => fmtMoney(amt, cur)).join(' + ');
  return `<div class="card">
    <h3>${t('overview_all_boutiques')}</h3>
    <div class="kpi-grid overview-kpi-grid">
      <div class="kpi"><div class="lbl">${t('kpi_boutiques')}</div><div class="val">${BOUTIQUES.length}</div></div>
      <div class="kpi kpi-highlight"><div class="lbl">${t('kpi_revenue_total')}</div><div class="val">${totalsHtml}</div></div>
      <div class="kpi"><div class="lbl">${t('kpi_orders_total')}</div><div class="val">${totalCommandes}</div></div>
      <div class="kpi"><div class="lbl">${t('kpi_pending')}</div><div class="val">${totalEnAttente}</div></div>

  </div>`;
}

function submitCreateBoutique() {
  const name = document.getElementById('newBoutiqueName').value.trim();
  const city = document.getElementById('newBoutiqueCity').value.trim();
  const country = document.getElementById('newBoutiqueCountry').value.trim();
  if (!name) return;
  if (!country) { document.getElementById('createBoutiqueMsg').innerHTML = '<div class="msg error">'+t('boutique_country_required')+'</div>'; return; }
  if (!isValidCountryValue(country)) { document.getElementById('createBoutiqueMsg').innerHTML = '<div class="msg error">'+t('boutique_country_invalid')+'</div>'; return; }
  if (!city) { document.getElementById('createBoutiqueMsg').innerHTML = '<div class="msg error">'+t('boutique_city_required')+'</div>'; return; }
  post('/boutiques?action=create', {name, city, country}).then(({data}) => {
    if (!data.success) { document.getElementById('createBoutiqueMsg').innerHTML = '<div class="msg error">'+data.message+'</div>'; return; }
    closeModal();
    loadBoutiques().then(() => { window.location.hash = '#/'+data.data.slug+'/home'; });
  });

function orderTypeBadge(o) {
  const icons = [];
  if (Number(o.has_physical) === 1) icons.push('<span title="'+t('badge_physical_title')+'">📦</span>');
  if (Number(o.has_digital) === 1) icons.push('<span title="'+t('badge_digital_title')+'">📧</span>');
  if (Number(o.has_physical) === 1) icons.push(o.delivery_method === 'shipping' ? '<span title="'+t('badge_shipping_title')+'">📮</span>' : '<span title="'+t('badge_delivery_title')+'">🚚</span>');

// Renvoie le meme contenu numerique (meme code, pas un nouveau pioche dans
// le pool - voir orders_resend_digital() cote serveur) - utile quand le
// client dit ne rien avoir recu (spam, adresse corrigee entre temps...).
function resendDigitalDelivery(orderId, ref) {

function openPrintReport(title, subtitle, bodyHtml) {
  const win = window.open('', '_blank', 'width=800,height=900');
  win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${escapeHtml(title)}</title>
    <style>
      body{font-family:Arial,sans-serif;color:#111;padding:24px;max-width:760px;margin:0 auto}
      h1{font-size:20px;margin:0 0 2px}
      .muted{color:#666;font-size:13px;margin-bottom:18px}
      table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
      th,td{padding:6px 8px;border-bottom:1px solid #ddd;text-align:left}
      th{background:#fff1e6}
      .kpis{display:flex;gap:12px;margin:14px 0}
      .kpi{flex:1;border:1px solid #ddd;border-radius:8px;padding:10px}
      .kpi .lbl{color:#666;font-size:11px;text-transform:uppercase}
      .kpi .val{font-size:18px;font-weight:bold}
    </style></head><body>
    <h1>${escapeHtml(CURRENT.name)}</h1>
    <div class="muted">${escapeHtml(title)} — ${escapeHtml(subtitle)}</div>
    ${bodyHtml}
    <script>window.onload = () => window.print();<\/script>
    </body></html>`);
  win.document.close();
}

// Le nom de campagne dans le lien doit rester EXACTEMENT tel que tape (pas
// de mise en minuscule/normalisation) : c'est cette meme valeur qui est
// comparee cote serveur (orders.utm_campaign) a ad_expenses.campaign_name
// pour calculer le ROAS - la moindre difference casserait le rattachement.
// productSlug n'est ajoute (&p=) que pour un seul produit precis : un lien
// ne peut ouvrir qu'une seule fiche a la fois, donc pour 0 ou plusieurs
// produits on renvoie vers la boutique entiere (le suivi par campagne
// fonctionne quand meme, quel que soit le produit achete).
function buildAdLink(campaignName, productSlug) {
  if (!campaignName) return '';
  const base = window.location.origin + window.location.pathname.replace(/dashboard\/.*/, '') + 'store/index.html?b=' + encodeURIComponent(CURRENT.slug);
  const p = productSlug ? '&p=' + encodeURIComponent(productSlug) : '';
  return base + p + '&utm_campaign=' + encodeURIComponent(campaignName);
}
function selectedAdProductChecks() {
  return Array.from(document.querySelectorAll('.adProductCheck:checked'));
}
function updateAdCampaignLink() {
  const name = document.getElementById('adCampaign').value.trim();
  const checked = selectedAdProductChecks();
  const slug = checked.length === 1 ? checked[0].dataset.slug : '';
  const link = buildAdLink(name, slug);
  const field = document.getElementById('adLinkField');
  const hint = document.getElementById('adLinkHint');
  if (hint) hint.textContent = checked.length > 1
    ? checked.length+t('ad_link_hint_multi_suffix')
    : t('ad_link_hint_single');
  field.style.display = link ? 'block' : 'none';
  if (link) document.getElementById('adLinkInput').value = link;
}
function copyGeneratedAdLink(campaignName, productSlug) {
  const link = buildAdLink(campaignName, productSlug);
  navigator.clipboard && navigator.clipboard.writeText(link);
}

// Etiquettes (tags) plutot qu'un champ texte libre "separe par des virgules"
// - ambigu et source d'erreur (un merchant qui tape des points-virgules se
// retrouvait avec une seule "valeur" fourre-tout au lieu de plusieurs
// tailles/couleurs distinctes, ex: "Rouge ;Vert; Orange" comme UNE seule
// valeur, donc une seule variante generee). Entree, virgule OU point-virgule
// valident une/des etiquette(s) - et si plusieurs valeurs separees par , ou
// ; ont ete tapees/collees d'un coup, chacune devient sa propre etiquette.
// L'espace n'est PAS un separateur (essaye puis retire sur demande) : des
// valeurs legitimes en contiennent (ex: "Vert fonce") et il n'y a pas de
// syntaxe d'echappement pour les distinguer sans complexifier la saisie.
// Retour arriere sur un champ vide supprime la derniere etiquette.
function handleOptionTagInput(e, rowIndex) {
  if (e.key === 'Enter' || e.key === ',' || e.key === ';') {
    e.preventDefault();
    const raw = e.target.value.replace(/[,;]$/, '');
    const parts = raw.split(/[,;]+/).map(v => v.trim()).filter(Boolean);
    if (parts.length) {
      if (!window.__optionRows[rowIndex].values) window.__optionRows[rowIndex].values = [];
      parts.forEach((val) => {
        if (!window.__optionRows[rowIndex].values.includes(val)) window.__optionRows[rowIndex].values.push(val);
      });
      renderOptionRows();
      focusOptionRowInput(rowIndex);
    } else {
      e.target.value = '';
    }
  } else if (e.key === 'Backspace' && e.target.value === '') {
    const vals = window.__optionRows[rowIndex].values || [];
    if (vals.length) { vals.pop(); renderOptionRows(); focusOptionRowInput(rowIndex); }
  }
}
function removeOptionTag(rowIndex, tagIndex) {
  window.__optionRows[rowIndex].values.splice(tagIndex, 1);

}

// Genere le produit cartesien des valeurs de chaque option (ex: Taille
// S/M/L x Couleur Rouge/Bleu -> 6 variantes "S / Rouge", "S / Bleu", ...).
// Les variantes deja existantes portant le meme nom conservent leur prix et
// leur stock au lieu d'etre reinitialisees a chaque regeneration.
function generateVariants() {
  const groups = window.__optionRows.filter(r => r.name.trim() && r.values && r.values.length);
  if (!groups.length) { showToast(t('err_option_values_required'), 'error'); return; }
  const combos = groups.reduce((acc, g) => {
    const next = [];
    acc.forEach(comboArr => g.values.forEach(v => next.push([...comboArr, v])));
    return next;
  }, [[]]);
  const existing = {};
  window.__productVariants.forEach(v => existing[v.name] = v);
  window.__productVariants = combos.map(comboArr => {
    const name = comboArr.join(' / ');
    return existing[name] || {name, price:'', stock_qty:0};
  });
  renderVariantsTable();
}
function renderVariantsTable() {
  const rows = window.__productVariants;
  document.getElementById('variantsTableWrap').innerHTML = rows.length ? `
    <label>${t('label_variants_generated_prefix')}${rows.length})</label>
    <table><thead><tr><th>${t('col_variant')}</th><th>${t('col_price_optional')}</th><th>${t('col_stock')}</th><th></th></tr></thead><tbody>
    ${rows.map((v,i)=>`<tr>
      <td>${escapeHtml(v.name)}</td>
      <td><input type="number" min="0" value="${v.price??''}" style="width:90px" oninput="window.__productVariants[${i}].price=this.value"></td>
      <td><input type="number" min="0" value="${v.stock_qty||0}" style="width:70px" oninput="window.__productVariants[${i}].stock_qty=Number(this.value||0)"></td>
      <td><button type="button" class="btn btn-ghost btn-sm" onclick="removeVariantRow(${i})">✕</button></td>
    </tr>`).join('')}
    </tbody></table>` : '';
}

// Redimensionne/compresse une photo cote navigateur avant de l'envoyer -
// evite d'avoir a heberger les images ailleurs (pas de compte S3/Cloudinary
// a configurer) : elles sont stockees en base64 directement en base (colonne
// TEXT/product_images.data, aucune limite pratique pour un petit catalogue).
function resizeImageToDataUrl(file, maxDim, cb) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.8));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
// Avant la creation du produit, les photos supplementaires (au-dela de la
// principale) sont gardees en memoire (window.__pendingExtraImages) et
// envoyees avec le reste du formulaire a la sauvegarde (voir
// submitProductForm() -> payload.extra_images) - plus besoin d'enregistrer
// le produit une premiere fois avant de pouvoir en ajouter plusieurs.
function handleNewProductImageFile(input) {
  const files = Array.from(input.files || []);
  if (!files.length) return;
  window.__pendingExtraImages = window.__pendingExtraImages || [];
  let chain = Promise.resolve();
  files.forEach(file => {
    chain = chain.then(() => new Promise(resolve => {
      const primary = document.getElementById('prodImage').value.trim();
      const total = (primary ? 1 : 0) + window.__pendingExtraImages.length;
      if (total >= 5) { resolve(); return; }
      resizeImageToDataUrl(file, 900, dataUrl => {
        if (!document.getElementById('prodImage').value.trim()) {
          document.getElementById('prodImage').value = dataUrl;
        } else {
          window.__pendingExtraImages.push(dataUrl);
        }
        resolve();
      });
    }));
  });
  chain.then(renderPendingImagesGrid);
  input.value = '';
}
function renderPendingImagesGrid() {
  const grid = document.getElementById('pendingImagesGrid');
  if (!grid) return;
  const primary = document.getElementById('prodImage').value.trim();
  const all = primary ? [primary, ...(window.__pendingExtraImages || [])] : (window.__pendingExtraImages || []);
  grid.innerHTML = all.map((data, i) => `
    <div style="position:relative">
      <img src="${data}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:2px solid ${i===0?'var(--blue)':'var(--border)'}">
      ${i===0 ? '<span style="position:absolute;bottom:2px;left:2px;background:var(--blue);color:#fff;font-size:9px;padding:1px 4px;border-radius:4px">'+t('label_primary_photo')+'</span>' : ''}
      <button type="button" onclick="removePendingImage(${i})" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:11px;cursor:pointer;line-height:1">✕</button>
    </div>`).join('');
}
function removePendingImage(index) {
  const primary = document.getElementById('prodImage').value.trim();
  const all = primary ? [primary, ...(window.__pendingExtraImages || [])] : (window.__pendingExtraImages || []);
  all.splice(index, 1);
  document.getElementById('prodImage').value = all[0] || '';
  window.__pendingExtraImages = all.slice(1);
  renderPendingImagesGrid();
}
function addProductImage(input) {

function submitPromotionForm(id) {
  const value = Number(document.getElementById('promotionValue').value||0);
  const product_ids = Array.from(document.querySelectorAll('.promotionProductCheck:checked')).map(c=>c.value);
  if (value<=0) { document.getElementById('promotionMsg').innerHTML = '<div class="msg error">'+t('err_value_required')+'</div>'; return; }
  if (!product_ids.length) { document.getElementById('promotionMsg').innerHTML = '<div class="msg error">'+t('err_select_one_product')+'</div>'; return; }
  const payload = {
    boutique_id: CURRENT.id, type: document.getElementById('promotionType').value, value, product_ids,
    starts_at: document.getElementById('promotionStarts').value || null,
    expires_at: document.getElementById('promotionExpires').value || null,
  };
  const action = id ? '/marketing?action=promotion_update' : '/marketing?action=promotion_create';
  if (id) payload.id = id;
  post(action, payload).then(({data}) => {
    if (!data.success) { document.getElementById('promotionMsg').innerHTML = '<div class="msg error">'+escapeHtml(data.message)+'</div>'; return; }
    closeModal(); route();
  });
}

// L'icone reflete l'etat ACTUEL du champ : 🙈 = actuellement masque
// (cliquer pour reveler), 👁️ = actuellement visible (cliquer pour masquer).
function togglePasswordVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  const reveal = input.type === 'password';
  input.type = reveal ? 'text' : 'password';
  btn.textContent = reveal ? '👁️' : '🙈';
}
function copyInput(id) {
  const input = document.getElementById(id);
  input.select();
  navigator.clipboard && navigator.clipboard.writeText(input.value);
}
// Lien de PARTAGE (pas le lien direct) : passe par le backend qui genere
// une page avec les vraies balises Open Graph (nom, logo) avant de
// rediriger instantanement vers la vraie boutique - sans ca, un lien
// partage sur WhatsApp/Facebook n'affiche aucun apercu correct (le site
// est 100% en JavaScript, les robots de previsualisation ne l'executent
// pas). Voir route_preview() cote serveur.
function storeLink() {
  return API_URL + '/preview?action=shop&slug=' + encodeURIComponent(CURRENT.slug);
}
// Chaque reseau a sa propre URL de partage "toute prete" (le fameux
// "intent" web) - pas d'API a appeler, juste ouvrir ce lien suffit a
// pre-remplir le message avec le lien de la boutique. Instagram n'a pas
// d'equivalent web, d'ou l'absence de bouton pour ce reseau.
function shareStoreOn(network) {
  const link = storeLink();
  const text = (LANG === 'en' ? 'Check out ' : 'Découvrez ') + CURRENT.name + (LANG === 'en' ? '!' : ' !');
  const urls = {
    whatsapp: 'https://wa.me/?text=' + encodeURIComponent(text + ' ' + link),
    facebook: 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(link),
    telegram: 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(text),
    x: 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(link),
  };
  if (network === 'tiktok') {
    navigator.clipboard.writeText(link).catch(() => {});
    showToast(t('tiktok_link_copied'), 'info');
    window.open('https://www.tiktok.com/upload', '_blank');
    return;
  }
  if (urls[network]) window.open(urls[network], '_blank');
}
function requestPayout() {
  const phone = document.getElementById('payoutPhone').value.trim();
  if (!phone) { showToast(t('err_mobile_money_required'), 'error'); return; }
  post('/billing?action=affiliate_request_payout', {method:document.getElementById('payoutMethod').value, phone}).then(({data}) => {
    showToast(data.message, data.success ? 'success' : 'error');
    if (data.success) renderAffiliate();
  });
}

function renderIntegrations(bt) {
  document.getElementById('content').innerHTML = `<div class="empty">${t('loading')}</div>`;
  api('/integrations?action=sheet_get&boutique_id='+bt.id).then(({data}) => {
    if (!data.success) { document.getElementById('content').innerHTML = '<div class="card">'+escapeHtml(data.message)+'</div>'; return; }
    const S = data.data;
    document.getElementById('content').innerHTML = `
      <h2 class="page-title">${t('integrations_title')}</h2>
      <div class="page-sub">${t('integrations_subtitle')}</div>
      <div class="card">
        <h3>${t('gsheets_title')}</h3>
        <div class="page-sub">${t('gsheets_subtitle')}</div>
        <div id="sheetMsg"></div>
        <div class="field"><label>${t('label_sheet_link')}</label><input id="sheetUrl" value="${escapeHtml(S.sheet_url||'')}" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv"></div>
        <label style="display:flex;align-items:center;gap:8px;margin-bottom:14px"><input type="checkbox" id="sheetEnabled" ${S.sheet_sync_enabled?'checked':''}> ${t('checkbox_enable_integration')}</label>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" onclick="saveSheetSettings()">${t('btn_save')}</button>
          <button class="btn btn-ghost" onclick="importSheetNow()">${t('btn_import_now')}</button>
        </div>
      </div>
      <div class="card">
        <h3>${t('expected_columns_title')}</h3>
        <table><thead><tr><th>${t('col_column')}</th><th>${t('col_required')}</th><th>${t('col_example')}</th></tr></thead><tbody>
          <tr><td>id_commande</td><td>${t('yes_word')}</td><td>CMD-1042</td></tr>
          <tr><td>client</td><td>${t('yes_word')}</td><td>Awa Diallo</td></tr>
          <tr><td>telephone</td><td>${t('yes_word')}</td><td>+225 07 00 00 00</td></tr>
          <tr><td>sku</td><td>${t('yes_word')}</td><td>TS-BLEU-M (doit exister dans vos produits)</td></tr>
          <tr><td>quantite</td><td>${t('no_word')}</td><td>2 (vide = 1)</td></tr>
          <tr><td>prix_unitaire</td><td>${t('no_word')}</td><td>14900 (vide = prix catalogue)</td></tr>
          <tr><td>frais_livraison</td><td>${t('no_word')}</td><td>2000 (une seule ligne par commande)</td></tr>
          <tr><td>ville / quartier / adresse</td><td>${t('no_word')}</td><td>Abidjan / Cocody / Rue des Jardins</td></tr>
        </tbody></table>
        <div class="muted" style="margin-top:10px">${t('multi_product_order_note')}</div>
      </div>
      <div class="card" id="sheetResultCard" style="display:none"></div>
    `;
  });
}
function saveSheetSettings() {
  post('/integrations?action=sheet_save', {boutique_id:CURRENT.id, sheet_url:document.getElementById('sheetUrl').value.trim(), sheet_sync_enabled:document.getElementById('sheetEnabled').checked}).then(({data}) => {
    document.getElementById('sheetMsg').innerHTML = '<div class="msg '+(data.success?'success':'error')+'">'+data.message+'</div>';
  });
}
function importSheetNow() {
  saveSheetSettings();
  post('/integrations?action=sheet_import', {boutique_id:CURRENT.id}).then(({data}) => {
    const card = document.getElementById('sheetResultCard');
    card.style.display = 'block';
    if (!data.success) { card.innerHTML = '<div class="msg error">'+data.message+'</div>'; return; }
    card.innerHTML = '<h3>'+t('import_result_title')+'</h3><div class="msg success">'+data.message+'</div>' +
      (data.data.skipped.length ? '<div class="muted">'+t('skipped_rows_prefix')+'<br>'+data.data.skipped.map(escapeHtml).join('<br>')+'</div>' : '');
  });
}
</script>
